<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moonphase Flip — Beta Q&amp;A</title>
<link rel="icon" href="favicon-landing.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --lp-bg: #F6F4F1;
    --lp-yellow: #FFFBC1;
    --lp-brown: #402F1E;
    --lp-gray: #9D968B;
    --lp-cream: #F3EFE8;
    --lp-ink: #000000;
    --lp-line: #605A50;
    --lp-answer: #7F715C;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Instrument Sans", "Noto Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(255,251,193,0.55), transparent 55%),
      linear-gradient(180deg, var(--lp-bg), var(--lp-cream));
    color: var(--lp-brown);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brand img {
    width: 36px; height: 36px; border-radius: 8px;
    object-fit: cover; background: var(--lp-ink);
    box-shadow: 0 1px 0 rgba(64,47,30,0.08), 0 8px 20px rgba(64,47,30,0.08);
  }
  .brand-text {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-gray); font-weight: 500;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: clamp(2rem, 5vw, 2.55rem); letter-spacing: -0.02em;
    line-height: 1.15; margin: 0 0 12px; color: var(--lp-ink);
  }
  h1 em { font-style: italic; color: var(--lp-answer); }
  .sub {
    color: var(--lp-gray); font-size: 0.98rem; margin: 0 0 28px; max-width: 36em;
  }
  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 4px;
    background: rgba(64,47,30,0.04); border: 1px solid rgba(96,90,80,0.22);
    border-radius: 999px; margin-bottom: 16px; width: fit-content; max-width: 100%;
  }
  .tab {
    appearance: none; border: none; background: transparent; color: var(--lp-gray);
    border-radius: 999px; padding: 9px 14px; cursor: pointer; font-size: 0.84rem;
    font-weight: 500; font-family: inherit;
  }
  .tab:hover { color: var(--lp-brown); }
  .tab[aria-selected="true"] {
    background: var(--lp-brown); color: var(--lp-yellow);
  }
  .search-wrap { position: relative; margin-bottom: 22px; }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--lp-gray); pointer-events: none;
  }
  input[type="search"] {
    width: 100%; background: #fff; border: 1px solid rgba(96,90,80,0.28);
    color: var(--lp-brown); border-radius: 12px;
    padding: 13px 14px 13px 40px; font-size: 0.95rem; font-family: inherit; outline: none;
  }
  input[type="search"]::placeholder { color: var(--lp-gray); }
  input[type="search"]:focus {
    border-color: var(--lp-answer);
    box-shadow: 0 0 0 3px rgba(127,113,92,0.18);
  }
  .item {
    background: #fff;
    border: 1px solid rgba(96,90,80,0.18);
    border-radius: var(--radius);
    padding: 18px 18px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 10px 28px rgba(64,47,30,0.05);
  }
  .item:hover {
    border-color: rgba(96,90,80,0.32);
    background: linear-gradient(180deg, #fff, var(--lp-yellow));
  }
  .item h3 {
    margin: 0 0 8px; font-size: 1.02rem; font-weight: 600;
    letter-spacing: -0.01em; line-height: 1.35; color: var(--lp-ink);
  }
  .item p { margin: 0; color: var(--lp-answer); font-size: 0.92rem; line-height: 1.55; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .pill {
    font-size: 0.7rem; font-weight: 500; letter-spacing: 0.02em; border-radius: 999px;
    padding: 4px 9px; border: 1px solid rgba(96,90,80,0.22);
    color: var(--lp-answer); background: var(--lp-cream);
  }
  .ok {
    color: #3f6b4a; border-color: rgba(63,107,74,0.28); background: rgba(63,107,74,0.08);
  }
  .warn {
    color: #8a6a2a; border-color: rgba(138,106,42,0.28); background: rgba(255,251,193,0.65);
  }
  .empty { color: var(--lp-gray); padding: 40px 8px; text-align: center; font-size: 0.95rem; }
  footer {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(96,90,80,0.2);
    color: var(--lp-gray); font-size: 0.78rem;
  }
  @media (max-width: 520px) {
    .wrap { padding: 32px 16px 64px; }
    .tabs { width: 100%; }
    .tab { flex: 1 1 auto; text-align: center; padding: 9px 10px; font-size: 0.8rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="M.png" width="36" height="36" alt="Moonphase" />
    <div class="brand-text">Moonphase Flip · Beta</div>
  </div>
  <h1>Beta Q&amp;A <em>window</em></h1>
  <p class="sub">Official answers and how to report for Moonphase Flip beta testers.</p>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="answers" aria-selected="true">Answers</button>
    <button class="tab" data-tab="report" aria-selected="false">How to report</button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search calendar, firmware, recording, sync…" autocomplete="off" />
  </div>
  <div id="list"></div>
  <footer>Moonphase Flip beta support · content refreshed regularly</footer>
</div>
<script>
const DATA = {
  answers: [
    {
      id: "FB-015",
      q: "Is the device meant to record most of the day? How much can it store, and how often should I clear recordings?",
      a: "You can leave it on all day. It only keeps audio when someone is speaking. After recordings sync to your phone, they're cleared from the device automatically — no manual purge needed.",
      status: "Answered",
      tone: "ok"
    },
    {
      id: "FB-004",
      q: "Will I get shipping tracking, and how do I send bug reports / usage feedback to the team?",
      a: "Tracking is sent by DM after units ship. For bugs and beta feedback, post in General or your personal Beta Support group.",
      status: "Answered",
      tone: "ok"
    },
    {
      id: "FB-034",
      q: "After an iOS app update, which build should I be on?",
      a: "Use TestFlight. The current correct build is 1.0.1 (1217).",
      status: "Answered",
      tone: "ok"
    },
    {
      id: "FB-035",
      q: "My device just arrived — how do I get on the firmware upgrade list?",
      a: "Send your serial number to the team so you can be added to the upgrade list. Then watch the app for a firmware update prompt.",
      status: "Answered",
      tone: "ok"
    },
    {
      id: "FB-024",
      q: "Is it allowed to use Flip with other AIs (for example via MCP) under the NDA?",
      a: "MCP is part of the beta; it's fine to try with other AIs.",
      status: "Answered",
      tone: "ok"
    },
    {
      id: "FB-028",
      q: "Why am I seeing Chinese characters in the UI or AI output?",
      a: "This language bug was fixed. If you still see it, report with a screenshot in General or your personal Beta Support group.",
      status: "Fixed — watch",
      tone: "ok"
    },
    {
      id: "FB-009",
      q: "Google Calendar events show in the app but not on the device.",
      a: "Older firmware often won't show Google Calendar events on the device. Install the latest firmware; events for calendars listed in the app can then appear on device. Flip currently only connects calendars listed in the app. More calendar types are coming.",
      status: "Answered · workaround",
      tone: "ok"
    },
    {
      id: "FB-014",
      q: "How do I recover a stuck device / recording that never returns?",
      a: "If the device looks stuck (shows recording but nothing follows), try a factory reset from the app — several testers recovered this way. Stuck cases often also need a targeted firmware update after you share your serial number with the team.",
      status: "Answered · workaround",
      tone: "ok"
    },
    {
      id: "FB-010",
      q: "Is MagSafe hold strong enough, or do I need a metal ring on my case?",
      a: "It depends on your case. Some MagSafe cases hold securely with no ring; others feel stronger with a metal ring added.",
      status: "Answered",
      tone: "ok"
    },
    {
      id: "PRIV-01",
      q: "Where is beta data stored, and does it meet US requirements?",
      a: "Beta data is stored on AWS in the United States and is handled to meet applicable US rules.",
      status: "Answered",
      tone: "ok"
    }
  ],
  report: [
    {
      id: "R1",
      q: "General",
      a: "Shared questions, announcements, and bug reports visible to the beta group.",
      status: "Channel",
      tone: "ok"
    },
    {
      id: "R2",
      q: "Personal Beta Support group",
      a: "Your private thread with the support team for shipment, serial number, and one-to-one issues.",
      status: "Channel",
      tone: "ok"
    },
    {
      id: "R3",
      q: "What helps most when you report",
      a: "Steps to reproduce, serial number (for firmware), app + firmware versions, and a screenshot or short video.",
      status: "Tips",
      tone: "ok"
    }
  ]
};
let tab = "answers";
const listEl = document.getElementById("list");
const qEl = document.getElementById("q");
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function render() {
  const q = (qEl.value || "").trim().toLowerCase();
  let items = DATA[tab] || [];
  if (q) items = items.filter(i => (i.q + i.a + i.id).toLowerCase().includes(q));
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">No matches — try another word.</div>';
    return;
  }
  listEl.innerHTML = items.map(i =>
    `<article class="item"><h3>${esc(i.q)}</h3><p>${esc(i.a)}</p><div class="meta"><span class="pill ${esc(i.tone)}">${esc(i.status)}</span></div></article>`
  ).join("");
}
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  tab = btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
  render();
}));
qEl.addEventListener("input", render);
render();
</script>
</body>
</html>
