<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)" />
<title>Moonphase Flip — Beta Q&amp;A Center</title>
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F7F7F5;--elev:#FFF;--soft:#EEEEEC;--glass:rgba(247,247,245,.82);--ink:#0A0A0A;--soft-ink:#3F3F46;--muted:#71717A;--line:rgba(10,10,10,.08);--line2:rgba(10,10,10,.14);--focus:#5E6AD2;--focus-soft:rgba(94,106,210,.18);--ok:#15803D;--ok-bg:rgba(21,128,61,.08);--hl:#0A0A0A;--shadow:0 0 0 1px rgba(10,10,10,.04),0 14px 36px rgba(10,10,10,.05);--ease:cubic-bezier(.16,1,.3,1);--r:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#08090A;--elev:#111113;--soft:#18181B;--glass:rgba(8,9,10,.82);--ink:#FAFAFA;--soft-ink:#D4D4D8;--muted:#A1A1AA;--line:rgba(250,250,250,.08);--line2:rgba(250,250,250,.14);--focus:#8FA4FF;--focus-soft:rgba(143,164,255,.22);--ok:#4ADE80;--ok-bg:rgba(74,222,128,.1);--hl:#FAFAFA;--shadow:0 0 0 1px rgba(255,255,255,.045),0 20px 48px rgba(0,0,0,.55)}}
html.theme-light{--bg:#F7F7F5;--elev:#FFF;--soft:#EEEEEC;--glass:rgba(247,247,245,.82);--ink:#0A0A0A;--soft-ink:#3F3F46;--muted:#71717A;--line:rgba(10,10,10,.08);--line2:rgba(10,10,10,.14);--focus:#5E6AD2;--focus-soft:rgba(94,106,210,.18);--ok:#15803D;--ok-bg:rgba(21,128,61,.08);--hl:#0A0A0A;--shadow:0 0 0 1px rgba(10,10,10,.04),0 14px 36px rgba(10,10,10,.05)}
html.theme-dark{--bg:#08090A;--elev:#111113;--soft:#18181B;--glass:rgba(8,9,10,.82);--ink:#FAFAFA;--soft-ink:#D4D4D8;--muted:#A1A1AA;--line:rgba(250,250,250,.08);--line2:rgba(250,250,250,.14);--focus:#8FA4FF;--focus-soft:rgba(143,164,255,.22);--ok:#4ADE80;--ok-bg:rgba(74,222,128,.1);--hl:#FAFAFA;--shadow:0 0 0 1px rgba(255,255,255,.045),0 20px 48px rgba(0,0,0,.55)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -18%,color-mix(in srgb,var(--focus) 9%,transparent),transparent 58%),linear-gradient(180deg,var(--bg),var(--soft));color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .55s var(--ease),color .55s var(--ease)}
.fresh{position:sticky;top:0;z-index:40;display:flex;justify-content:center;padding:10px 16px;background:var(--glass);backdrop-filter:saturate(1.25) blur(16px);-webkit-backdrop-filter:saturate(1.25) blur(16px);border-bottom:1px solid var(--line);opacity:0;transform:translateY(-10px);animation:rise .55s var(--ease) .02s forwards}
.fresh span{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fresh i{width:6px;height:6px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);font-style:normal;animation:pulse 2.4s var(--ease) infinite}
.shell{max-width:1120px;margin:0 auto;padding:28px 22px 88px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px;opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) .06s forwards}
.oo{width:28px;height:28px;object-fit:contain;flex:0 0 auto}
.wm{height:36px;width:auto;max-width:min(300px,64vw);object-fit:contain;display:block;transition:opacity .45s var(--ease)}
.wm-light,.oo-light{display:block}.wm-dark,.oo-dark{display:none}
@media (prefers-color-scheme:dark){.wm-light,.oo-light{display:none}.wm-dark,.oo-dark{display:block}}
html.theme-dark .wm-light,html.theme-dark .oo-light{display:none}html.theme-dark .wm-dark,html.theme-dark .oo-dark{display:block}
html.theme-light .wm-light,html.theme-light .oo-light{display:block}html.theme-light .wm-dark,html.theme-light .oo-dark{display:none}
.brand-meta{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hero{opacity:0;transform:translateY(16px);animation:rise .75s var(--ease) .12s forwards}
h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(2rem,4.6vw,2.7rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 10px}
h1 em{font-style:italic;color:var(--soft-ink)}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 20px;max-width:42em}
.layout{display:block}
.rail{margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;opacity:0;transform:translateY(12px);animation:rise .65s var(--ease) .18s forwards}
.search{position:relative;flex:1 1 220px;min-width:180px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
input[type=search]{width:100%;background:var(--elev);border:1px solid var(--line2);color:var(--ink);border-radius:12px;padding:12px 14px 12px 40px;font:inherit;font-size:.95rem;outline:none;transition:border-color .25s var(--ease),box-shadow .35s var(--ease)}
input[type=search]:focus{border-color:color-mix(in srgb,var(--focus) 55%,var(--line2));box-shadow:0 0 0 4px var(--focus-soft)}
.sort{display:inline-flex;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);gap:2px}
.sort button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.74rem;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease)}
.sort button:hover{color:var(--ink)}
.sort button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;opacity:0;transform:translateY(12px);animation:rise .65s var(--ease) .24s forwards}
.cat{appearance:none;border:1px solid var(--line);background:var(--elev);color:var(--soft-ink);border-radius:12px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;box-shadow:var(--shadow);transition:transform .4s var(--ease),border-color .25s var(--ease),background .25s var(--ease),color .25s var(--ease),box-shadow .4s var(--ease)}
.cat:hover{transform:translateY(-2px) scale(1.01);border-color:var(--line2);color:var(--ink)}
.cat[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat[aria-selected=true] .h{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.cat .l{display:block;font-size:.78rem;font-weight:600}
.cat .h{display:block;margin-top:2px;font-size:.66rem;color:var(--muted)}
.sec{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px;font-weight:500}
.item{background:var(--elev);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px);transition:border-color .3s var(--ease),transform .45s var(--ease),box-shadow .45s var(--ease),filter .45s var(--ease),background .5s var(--ease)}
.item.is-in{opacity:1;transform:none;filter:none}
.item:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent),0 24px 52px color-mix(in srgb,var(--ink) 9%,transparent)}
.item.is-new{border-color:color-mix(in srgb,var(--ink) 18%,var(--line))}
.item summary{list-style:none;cursor:pointer;padding:16px 18px 14px;display:grid;gap:8px}
.item summary::-webkit-details-marker{display:none}
.item summary .q{font-size:1rem;font-weight:600;letter-spacing:-.015em;line-height:1.35;color:var(--ink);padding-right:28px;position:relative}
.item summary .q::after{content:"+";position:absolute;right:0;top:0;color:var(--muted);font-weight:500;font-size:1.1rem;transition:transform .35s var(--ease),color .25s var(--ease)}
.item[open] summary .q::after{content:"–";color:var(--ink)}
.item summary .teaser{margin:0;color:var(--soft-ink);font-size:.88rem;line-height:1.45}
.item .body{padding:0 18px 16px;color:var(--soft-ink);font-size:.92rem;line-height:1.58;border-top:1px solid var(--line);animation:fadeIn .35s var(--ease)}
.item .body p{margin:12px 0 0}.item .body strong{color:var(--hl);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.pill{font-size:.66rem;font-weight:500;letter-spacing:.03em;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--soft-ink);background:var(--soft)}
.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 28%,transparent);background:var(--ok-bg)}
.empty{color:var(--muted);padding:44px 8px;text-align:center}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.76rem;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:color .25s var(--ease),border-color .25s var(--ease)}
footer a:hover{color:var(--ink);border-bottom-color:var(--line2)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.75}}
@media (min-width:960px){
  .shell{padding:36px 28px 96px}
  .layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;align-items:start}
  .rail{position:sticky;top:56px;margin-bottom:0}
  .cats{grid-template-columns:1fr;gap:6px}
  .wm{height:42px;max-width:320px}
  h1{font-size:clamp(2.3rem,3.4vw,2.9rem)}
}
@media (min-width:1200px){
  .shell{max-width:1200px}
  #list.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  #list.two-col .item{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fresh,.brand,.hero,.toolbar,.cats,.item,.item .body,.fresh i{animation:none!important;opacity:1!important;transform:none!important;filter:none!important;transition:none!important}.item:hover,.cat:hover{transform:none}}
@media (max-width:640px){.shell{padding:22px 16px 72px}.toolbar{flex-direction:column;align-items:stretch}.sort{align-self:flex-start}}
</style>
</head>
<body>
<div class="fresh" role="status"><span><i></i> Updated Oct 24, 2026</span></div>
<div class="shell">
  <div class="brand">
    <img class="oo oo-light" src="mark-oo-black.png" width="28" height="28" alt="" />
    <img class="oo oo-dark" src="mark-oo-white.png" width="28" height="28" alt="" />
    <img class="wm wm-light" src="wordmark-black.png" height="36" alt="MOONPHASE" />
    <img class="wm wm-dark" src="wordmark-white.png" height="36" alt="MOONPHASE" />
    <div class="brand-meta">Flip · Beta</div>
  </div>
  <div class="hero">
    <h1>Beta Q&amp;A <em>Center</em></h1>
    <p class="sub">Official answers for Moonphase Flip testers. Search, filter by topic, sort newest or oldest — tap a card for the full answer.</p>
  </div>
  <div class="layout">
    <aside class="rail" aria-label="Topics">
      <div class="cats" role="tablist">
        <button class="cat" data-tab="all" aria-selected="true"><span class="l">All</span><span class="h">Every answered item</span></button>
        <button class="cat" data-tab="getting-started" aria-selected="false"><span class="l">Getting started</span><span class="h">Setup &amp; shipping</span></button>
        <button class="cat" data-tab="device" aria-selected="false"><span class="l">Device</span><span class="h">Hardware recovery</span></button>
        <button class="cat" data-tab="app-firmware" aria-selected="false"><span class="l">App &amp; firmware</span><span class="h">Updates &amp; sync</span></button>
        <button class="cat" data-tab="recording-ai" aria-selected="false"><span class="l">Recording &amp; AI</span><span class="h">Capture &amp; storage</span></button>
        <button class="cat" data-tab="privacy" aria-selected="false"><span class="l">Privacy &amp; MCP</span><span class="h">Data &amp; other AIs</span></button>
        <button class="cat" data-tab="feedback" aria-selected="false"><span class="l">How to report</span><span class="h">Channels &amp; tips</span></button>
      </div>
    </aside>
    <div class="main">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search shipping, firmware, calendar, MCP…" autocomplete="off" />
        </div>
        <div class="sort" role="group" aria-label="Sort order">
          <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
          <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
        </div>
      </div>
      <div class="sec" id="sec">All answers</div>
      <div id="list" class="two-col"></div>
      <footer>
        <span>Moonphase Flip beta support</span>
        <a href="https://hellomoonphase.com/" target="_blank" rel="noopener noreferrer">Moonphase Flip</a>
      </footer>
    </div>
  </div>
</div>
<script>
const PAGE_UPDATED="2026-10-24";
const LABELS={"all":"All answers","getting-started":"Getting started","device":"Device","app-firmware":"App & firmware","recording-ai":"Recording & AI","privacy":"Privacy & MCP","feedback":"How to report"};
const DATA=[{"id":"FB-004","cat":"getting-started","sortKey":"2026-10-22","q":"Shipping tracking and where to send bug reports?","teaser":"UPS shipping; team email; report bugs in General or Beta Support.","a":"Units ship via <strong>UPS</strong>. The team emails you; <strong>tracking can take a while</strong>. For bugs, post in <strong>General</strong> or your personal <strong>Beta Support</strong> group."},{"id":"FB-035","cat":"getting-started","sortKey":"2026-10-24","q":"Device just arrived — what next?","teaser":"Send your serial number (SN), wait for our firmware-push notification, then follow Checklist_revised.","a":"<p>Send your <strong>serial number (SN)</strong> so the team can prepare a firmware push.</p><p><strong>Pause</strong> — wait until <strong>we notify you</strong> that the new firmware update has been pushed.</p><p>Then open Announcements and continue with <strong>Checklist_revised.pdf</strong> (plus QuickStart / Checklist as needed).</p>"},{"id":"FB-014","cat":"device","sortKey":"2026-10-24","q":"Recording shows, but nothing returns — or stuck on firmware 1.0.68?","teaser":"Send your serial number (SN), then wait for our firmware-push notification before continuing the checklist.","a":"<p>Send your <strong>serial number (SN)</strong> to the team.</p><p><strong>Pause</strong> — wait until <strong>we notify you</strong> that the new firmware update has been pushed to your unit.</p><p>Only after that notification, continue with the steps in <strong>Checklist_revised</strong> (Announcements).</p><p>If you are still on <strong>1.0.68</strong>, the same path applies: share your SN and wait for our push notification.</p>"},{"id":"FB-034","cat":"app-firmware","sortKey":"2026-10-24","q":"Which iOS app build should I use?","teaser":"TestFlight 1.0.1 (1217).","a":"Use <strong>TestFlight</strong>. Current correct build: <strong>1.0.1 (1217)</strong>."},{"id":"FB-009","cat":"app-firmware","sortKey":"2026-10-24","q":"Calendar in app but not on device — or BT connected with no voice actions?","teaser":"Usually an app + firmware version issue; wait for the pending push.","a":"This is usually an <strong>app + firmware version</strong> issue. Send your <strong>serial number (SN)</strong> if asked, then <strong>wait for our notification</strong> that a firmware update has been pushed. After the push, calendars listed in the app should be able to sync to the device. Android / Fold calendar feedback is noted; <strong>no commitment yet</strong>."},{"id":"FB-028","cat":"app-firmware","sortKey":"2026-10-24","q":"Why Chinese characters in the UI or AI output?","teaser":"AI language bug under fix; send a screenshot if it returns.","a":"Chinese characters in the UI or AI output are treated as an <strong>AI language / prompt bug</strong>. The team is optimizing prompts. If you still see it, send a screenshot in <strong>General</strong> or your personal <strong>Beta Support</strong> group."},{"id":"FB-015","cat":"recording-ai","sortKey":"2026-10-23","q":"Can I leave recording on all day?","teaser":"Yes — only saves when someone speaks; auto-clears after sync.","a":"Yes — leave it on. It <strong>only keeps audio when someone is speaking</strong>. After sync to your phone, device storage <strong>clears automatically</strong>."},{"id":"FB-024","cat":"privacy","sortKey":"2026-10-24","q":"Can I use Flip with other AIs via MCP under the NDA?","teaser":"MCP is part of beta — fine to try with other AIs.","a":"<strong>MCP is part of the beta</strong>; it is fine to try with other AIs."},{"id":"PRIV-01","cat":"privacy","sortKey":"2026-10-24","q":"Where is beta data stored?","teaser":"AWS in the United States.","a":"Beta data is stored on <strong>AWS in the United States</strong> and handled to meet applicable US rules."},{"id":"R1","cat":"feedback","sortKey":"2026-10-22","q":"General channel","teaser":"Shared questions, announcements, and group bug reports.","a":"Shared questions, announcements, and bug reports visible to the beta group."},{"id":"R2","cat":"feedback","sortKey":"2026-10-22","q":"Personal Beta Support group","teaser":"Private thread for shipment, serial number (SN), and one-to-one issues.","a":"Your private thread for shipment, <strong>serial number (SN)</strong>, and one-to-one issues."},{"id":"R3","cat":"feedback","sortKey":"2026-10-24","q":"Docs and what to include when reporting","teaser":"Checklist docs in Announcements; include serial number (SN), versions, screenshot.","a":"Announcements has <strong>Checklist.pdf</strong>, <strong>QuickStartGuide.pdf</strong>, and <strong>Checklist_revised.pdf</strong> after firmware pushes. Reports help most with repro steps, <strong>serial number (SN)</strong>, app + firmware versions, and a screenshot or short video."}];
let tab="all", sortDir="newest";
const list=document.getElementById("list"), qEl=document.getElementById("q"), sec=document.getElementById("sec");
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function syncTheme(){const d=window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("theme-dark",d);document.documentElement.classList.toggle("theme-light",!d)}
syncTheme();window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function observe(){if(reduce){list.querySelectorAll(".item").forEach(el=>el.classList.add("is-in"));return}
 const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const el=e.target;const i=[...list.querySelectorAll(".item")].indexOf(el);el.style.transitionDelay=Math.min(i,10)*40+"ms";el.classList.add("is-in");io.unobserve(el)}})},{threshold:.08,rootMargin:"0px 0px -6% 0px"});
 list.querySelectorAll(".item").forEach(el=>io.observe(el))}
function render(){
 const q=(qEl.value||"").trim().toLowerCase();
 let items=DATA.slice();
 if(tab!=="all")items=items.filter(i=>i.cat===tab);
 if(q)items=items.filter(i=>(i.q+" "+i.a+" "+i.teaser+" "+i.id).toLowerCase().includes(q));
 items.sort((a,b)=> sortDir==="newest" ? (b.sortKey||"").localeCompare(a.sortKey||"") : (a.sortKey||"").localeCompare(b.sortKey||""));
 sec.textContent=LABELS[tab]||"Answers";
 if(!items.length){list.innerHTML='<div class="empty">No matches — try another word or topic.</div>';return}
 list.innerHTML=items.map(i=>`<details class="item${i.sortKey===PAGE_UPDATED?" is-new":""}" data-cat="${esc(i.cat)}"><summary><div class="q">${esc(i.q)}</div><p class="teaser">${esc(i.teaser)}</p><div class="meta"><span class="pill ok">Answered</span></div></summary><div class="body"><p>${i.a}</p></div></details>`).join("");
 observe();
}
document.querySelectorAll(".cat").forEach(btn=>btn.addEventListener("click",()=>{tab=btn.dataset.tab;document.querySelectorAll(".cat").forEach(b=>b.setAttribute("aria-selected",b===btn?"true":"false"));render()}));
document.querySelectorAll(".sort button").forEach(btn=>btn.addEventListener("click",()=>{sortDir=btn.dataset.sort;document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"));render()}));
qEl.addEventListener("input",render);render();
</script>
</body>
</html>
