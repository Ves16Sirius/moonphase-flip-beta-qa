<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<!-- theme-color = page --bg (Safari chrome). Aurora is a fixed soft wash on top — original #5B66C4 / #A898FF hues. -->
<meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)" id="themeColorMetaLight" />
<meta name="theme-color" content="#0E0F14" media="(prefers-color-scheme: dark)" id="themeColorMetaDark" />
<meta name="theme-color" content="#0E0F14" id="themeColorMeta" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Moonphase Flip — Beta Q&amp;A Center</title>
<script>
/* Theme bootstrap v8 — first visit defaults to DARK (manual-v8).
   Saved light/dark from toggle still wins. Wipe prior keys incl v7. */
(function(){
  var MANUAL='flip-beta-qa-theme-manual-v8';
  var STALE=[
    'flip-beta-qa-theme','flip-beta-qa-theme-v1','flip-beta-qa-theme-v2',
    'flip-beta-qa-theme-manual','flip-beta-qa-theme-v3','flip-beta-qa-theme-manual-v4',
    'flip-beta-qa-theme-manual-v5','flip-beta-qa-theme-manual-v6','flip-beta-qa-theme-manual-v7'
  ];
  var LIGHT_TC='#F6F5FB', DARK_TC='#0E0F14';
  var LIGHT_BG='#F6F5FB', DARK_BG='#0E0F14';
  try{
    for(var i=0;i<STALE.length;i++){
      try{localStorage.removeItem(STALE[i])}catch(e){}
    }
    var saved=null;
    try{
      var s=localStorage.getItem(MANUAL);
      if(s==='light'||s==='dark') saved=s;
    }catch(e){}
    var meta=document.getElementById('themeColorMeta');
    var metaL=document.getElementById('themeColorMetaLight');
    var metaD=document.getElementById('themeColorMetaDark');
    function setTC(theme, manual){
      var tc=theme==='dark'?DARK_TC:LIGHT_TC;
      var bg=theme==='dark'?DARK_BG:LIGHT_BG;
      if(meta) meta.setAttribute('content', tc);
      if(manual){
        if(metaL) metaL.setAttribute('content', tc);
        if(metaD) metaD.setAttribute('content', tc);
      }else{
        if(metaL) metaL.setAttribute('content', LIGHT_TC);
        if(metaD) metaD.setAttribute('content', DARK_TC);
      }
      /* Paint --bg (same hex as theme-color). Fixed aurora washes on top from viewport y=0. */
      document.documentElement.style.backgroundColor=bg;
      try{if(document.body) document.body.style.backgroundColor=bg}catch(e){}
    }
    if(saved){
      document.documentElement.setAttribute('data-theme', saved);
      document.documentElement.style.colorScheme=saved;
      setTC(saved, true);
    }else{
      /* No saved preference → DARK (not follow-system) */
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.style.colorScheme='dark';
      setTC('dark', true);
    }
  }catch(e){
    try{
      document.documentElement.setAttribute('data-theme','dark');
      document.documentElement.style.colorScheme='dark';
    }catch(_){}
  }
})();
</script>

<style>
/* Overhaul 2026-10-25 v10.16 — small top-left Moonphase wordmark · Updated under island · aurora/toggle/title from v10.15 kept */
:root{
  /* Surfaces */
  --bg:#F6F5FB;
  --bg-deep:#EEECF6;
  /* Legacy token unused for island slab; kept for any residual refs */
  --aurora-top:#F6F5FB;
  --surface:#FFFFFF;
  /* Ink hierarchy */
  --ink:#1A1917;
  --ink-soft:#2A2825;
  --title:#2A2520;
  --muted:#7C766E;
  --faint:#A8A29A;
  /* Lines & accents */
  --line:rgba(50,40,90,.08);
  --line2:rgba(50,40,90,.14);
  --accent:#635BFF;
  --accent-deep:#4F46E5;
  --accent-soft:rgba(99,91,255,.11);
  --cta:rgba(99,91,255,.08);
  --cta-ink:#4338CA;
  --cta-border:rgba(99,91,255,.20);
  --cta-hover:rgba(99,91,255,.14);
  --ok:#2F9E6B;
  --ok-soft:rgba(47,158,107,.14);
  /* Elevation — warm soft lift (premium light cards) */
  --shadow-sm:0 1px 2px rgba(40,28,12,.04), 0 2px 6px rgba(40,28,12,.03);
  --shadow-md:
    0 1px 2px rgba(40,28,12,.035),
    0 4px 10px rgba(40,28,12,.04),
    0 12px 28px rgba(40,28,12,.05);
  --shadow-lg:
    0 2px 4px rgba(40,28,12,.04),
    0 10px 24px rgba(40,28,12,.06),
    0 24px 48px rgba(40,28,12,.055);
  --control-bg:rgba(255,255,255,.88);
  --ease:cubic-bezier(.22,1,.36,1);
  /* Premium spring (stiffness~500, damping~20) — slight overshoot then settle */
  --ease-spring:linear(0, 0.041, 0.145, 0.284, 0.438, 0.589, 0.728, 0.847, 0.942, 1.014, 1.063, 1.093, 1.106, 1.108, 1.1, 1.087, 1.071, 1.055, 1.039, 1.024, 1.012, 1.003, 0.996, 0.992, 0.989, 0.988, 0.989, 0.99, 0.991, 0.993, 0.995, 0.996, 1);
  --dur:180ms;
  --r:20px;
  /* Families */
  --font:"Geist Sans",Geist,Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --display:"Instrument Serif",Georgia,serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* Type scale */
  --fs-hero:clamp(2.5rem,5.4vw,3.5rem);
  --fs-title:15.5px;
  --fs-body:14.5px;
  --fs-ui:13.5px;
  --fs-meta:12.5px;
  --fs-tag:11.5px;
  --fs-mono:11px;
  --fw-regular:400;
  --fw-medium:500;
  --fw-semibold:600;
  --lh-tight:1.2;
  --lh-title:1.32;
  --lh-body:1.62;
  --lh-ui:1.45;
  /* Controls / cards */
  --control-h:34px;
  --space:8px;
  --card-pad-x:24px;
  --card-pad-y:22px;
  color-scheme:light dark;
}
*,*::before,*::after{box-sizing:border-box}
html{
  scroll-behavior:smooth;overflow-x:hidden;width:100%;max-width:100%;
  color-scheme:light dark;
  /* Solid --bg = theme-color; fixed .aurora paints soft wash from viewport top under island */
  background-color:var(--bg);
  background:var(--bg);
  min-height:100%;
  min-height:100dvh;
  padding:0;
  margin:0;
}
html,body{-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
body{
  margin:0;min-height:100vh;min-height:100dvh;color:var(--ink-soft);
  background-color:var(--bg);
  background:var(--bg);
  font-family:var(--font);font-size:15px;line-height:1.55;font-weight:var(--fw-regular);
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  width:100%;max-width:100%;
  position:relative;
}
/* FIXED top-curtain aurora — always paints VISUAL viewport top under Dynamic Island.
   Persist: fixed + will-change:transform; never opacity 0 / unmount / scroll-hide.
   #aurora-sticky = thin backup wash if iOS Safari drops the fixed compositor layer. */
.aurora{
  position:fixed;
  top:0;left:0;right:0;
  width:100%;
  height:calc(env(safe-area-inset-top, 0px) + min(280px, 40vh));
  margin:0;padding:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
  isolation:isolate;
  will-change:transform;
  transform:translateZ(0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  /* Light default: soft lavender from physical top (no cream slab / purple cliff) */
  background:linear-gradient(180deg,
    color-mix(in srgb, #A898FF 28%, var(--bg)) 0%,
    color-mix(in srgb, #A898FF 18%, var(--bg)) 22%,
    color-mix(in srgb, #B8A8FF 10%, var(--bg)) 48%,
    color-mix(in srgb, #C8BCFF 4%, var(--bg)) 72%,
    transparent 100%);
  filter:none;
  opacity:1;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
}
/* Thin always-on top wash under island — no mask; survives iOS fixed-bg unload */
#aurora-sticky{
  position:fixed;
  top:0;left:0;right:0;
  width:100%;
  height:calc(env(safe-area-inset-top, 0px) + 96px);
  margin:0;padding:0;
  pointer-events:none;
  z-index:0;
  will-change:transform;
  transform:translateZ(0);
  background:linear-gradient(180deg,
    color-mix(in srgb, #A898FF 22%, var(--bg)) 0%,
    color-mix(in srgb, #A898FF 10%, var(--bg)) 55%,
    var(--bg) 100%);
  opacity:1;
}
.aurora-crown{
  display:none!important; /* gradient itself starts at y=0 — no solid slab crown */
}
.aurora-blobs{display:none!important}
.fresh,.shell,.modal-backdrop{position:relative;z-index:1}
.modal-backdrop{z-index:100}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent-deep);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
::selection{background:var(--accent-soft);color:var(--ink)}

/* —— Updated chip —— */
.fresh{
  display:flex;justify-content:center;align-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 0;
  background:transparent;border:0;box-shadow:none;
}
.fresh span{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px;border-radius:999px;
  background:var(--control-bg);
  border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--shadow-sm);
  font-family:var(--mono);font-size:var(--fs-mono);font-weight:var(--fw-medium);
  letter-spacing:.02em;color:var(--muted);
}
.fresh i{
  width:6px;height:6px;border-radius:50%;background:var(--ok);
  display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 3px var(--ok-soft); /* soft ring only — no scatter glow */
  animation:none;
}
@media (prefers-reduced-motion:reduce){
  .fresh i{animation:none!important}
}

/* —— Shell: comfortable max-width, balanced inset —— */
.shell{
  width:min(1120px,100%);margin:0 auto;
  padding:0 32px max(88px, env(safe-area-inset-bottom, 0px));
  padding-left:max(32px, env(safe-area-inset-left, 0px));
  padding-right:max(32px, env(safe-area-inset-right, 0px));
  position:relative;
}
.shell::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  opacity:.03;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 0 0.03 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 65%);
  mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 65%);
}
.shell > *{position:relative;z-index:1}

/* —— Brand row —— v10.16: small Moonphase wordmark TOP-LEFT + theme toggle TOP-RIGHT
   Updated chip stays above (centered under island). Hero title remains the headline. */
.brand{
  /* Toggle TOP == MOONPHASE wordmark TOP */
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  margin:18px 0 28px;position:relative;min-height:22px;
}
.brand-slot{
  flex:1 1 0;display:flex;align-items:flex-start;min-width:0;min-height:22px;
}
.brand-slot-start{justify-content:flex-start}
.brand-slot-end{justify-content:flex-end}
.brand-mark{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:flex-start;
}
.brand .wm{height:21px;width:auto;display:block}
/* Glass moon|sun switch — clear glass track · thumb CONTAINS active icon · spring slide
   Dims: --tt-w/--tt-h track, --tt-pad inset, --tt-thumb size, --tt-travel = w - 2*pad - thumb */
.theme-toggle{
  --tt-w:60px;
  --tt-h:28px;
  --tt-pad:3px;
  --tt-thumb:22px;
  --tt-travel:calc(var(--tt-w) - (var(--tt-pad) * 2) - var(--tt-thumb));
  position:relative;transform:none;isolation:isolate;
  align-self:flex-start;
  margin-top:-2px; /* optical flush with MOONPHASE glyph tops */
  height:var(--tt-h);min-height:var(--tt-h);
  width:var(--tt-w);min-width:var(--tt-w);
  padding:0;border-radius:999px;gap:0;
  display:inline-flex;align-items:center;justify-content:center;
  /* Clear glass pill track — readable on dark */
  border:1px solid rgba(255,255,255,.55);
  background:
    linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,.08) 100%);
  backdrop-filter:blur(28px) saturate(220%) brightness(1.16);
  -webkit-backdrop-filter:blur(28px) saturate(220%) brightness(1.16);
  box-shadow:
    0 1px 2px rgba(0,0,0,.28),
    0 6px 18px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.78),
    inset 0 -1px 0 rgba(255,255,255,.12),
    inset 1px 0 0 rgba(255,255,255,.32),
    inset -1px 0 0 rgba(255,255,255,.24);
  color:var(--muted);
  overflow:hidden; /* thumb never clips outside track */
  transition:background .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.theme-toggle::before{
  content:"";
  position:absolute;left:8%;right:8%;top:0;height:1px;border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
  pointer-events:none;z-index:4;opacity:.95;
}
.theme-toggle::after{
  content:"";
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:
    linear-gradient(135deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.16) 26%, transparent 52%),
    linear-gradient(210deg, transparent 40%, rgba(255,255,255,.10) 70%, transparent 100%);
  mix-blend-mode:screen;
  opacity:.9;
}
.theme-toggle:hover{
  border-color:rgba(255,255,255,.68);
  background:
    linear-gradient(180deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.10) 100%);
  box-shadow:
    0 2px 6px rgba(0,0,0,.28),
    0 8px 22px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.88),
    inset 0 -1px 0 rgba(255,255,255,.14),
    inset 1px 0 0 rgba(255,255,255,.36),
    inset -1px 0 0 rgba(255,255,255,.28);
}
.theme-toggle:active{transform:none}
.theme-toggle .tlabel{display:none!important}
.theme-toggle .tt-track{
  position:relative;z-index:1;
  display:block;
  width:100%;height:100%;
  border-radius:inherit;
  overflow:hidden;
}
/* Inactive icons sit at opposite ends of the glass track */
.theme-toggle .tt-icon{
  position:absolute;
  top:var(--tt-pad);
  width:var(--tt-thumb);height:var(--tt-thumb);
  margin:0;
  z-index:2;
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  opacity:.88;
  transition:opacity .28s var(--ease), color .28s var(--ease);
  color:#F0C14A;
}
.theme-toggle .tt-icon svg{
  width:12px;height:12px;display:block;flex:0 0 auto;
}
.theme-toggle .icon-moon{left:var(--tt-pad);right:auto;color:#C8B8E8}
.theme-toggle .icon-sun{right:var(--tt-pad);left:auto;color:#F0C14A}
/* Sliding circular thumb — CONTAINS the active icon, dead-centered */
.theme-toggle .tt-thumb{
  position:absolute;
  top:var(--tt-pad);left:var(--tt-pad);
  width:var(--tt-thumb);height:var(--tt-thumb);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg, #3A3C4C 0%, #1C1D26 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.45),
    0 4px 10px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.28);
  z-index:3;
  pointer-events:none;
  transform:translateX(0); /* dark → left (moon) */
  transition:transform .48s var(--ease-spring), background .28s var(--ease), box-shadow .28s var(--ease);
  will-change:transform;
}
.theme-toggle .tt-thumb-face{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .22s var(--ease);
}
.theme-toggle .tt-thumb-face svg{
  width:12px;height:12px;display:block;
}
.theme-toggle .tt-face-moon{color:#FFF8D0;opacity:1} /* dark-first default until theme attrs apply */
.theme-toggle .tt-face-sun{color:#8A6410;opacity:0}
/* Dark (default): thumb left, moon face on; sun stays visible on track right */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-toggle .tt-thumb{
    transform:translateX(0);
    background:linear-gradient(180deg, #3E4052 0%, #1A1B24 100%);
  }
  :root:not([data-theme="light"]) .theme-toggle .tt-face-moon{opacity:1}
  :root:not([data-theme="light"]) .theme-toggle .tt-face-sun{opacity:0}
  :root:not([data-theme="light"]) .theme-toggle .icon-moon{opacity:0} /* covered by thumb */
  :root:not([data-theme="light"]) .theme-toggle .icon-sun{opacity:.92;color:#F0C14A}
}
[data-theme="dark"] .theme-toggle .tt-thumb{
  transform:translateX(0);
  background:linear-gradient(180deg, #3E4052 0%, #1A1B24 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.48),
    0 4px 12px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.30);
}
[data-theme="dark"] .theme-toggle .tt-face-moon{opacity:1;color:#FFF8D0}
[data-theme="dark"] .theme-toggle .tt-face-sun{opacity:0}
[data-theme="dark"] .theme-toggle .icon-moon{opacity:0}
[data-theme="dark"] .theme-toggle .icon-sun{opacity:.92;color:#F0C14A}
/* Light: thumb right (travel), sun face on; moon visible on track left */
[data-theme="light"] .theme-toggle .tt-thumb{
  transform:translateX(var(--tt-travel));
  background:linear-gradient(180deg, #FFFFFF 0%, #F2F0F8 100%);
  box-shadow:
    0 1px 2px rgba(40,28,12,.16),
    0 4px 10px rgba(40,28,12,.14),
    inset 0 1px 0 rgba(255,255,255,1);
}
[data-theme="light"] .theme-toggle .tt-face-sun{opacity:1;color:#8A6410}
[data-theme="light"] .theme-toggle .tt-face-moon{opacity:0}
[data-theme="light"] .theme-toggle .icon-sun{opacity:0}
[data-theme="light"] .theme-toggle .icon-moon{opacity:.82;color:#3A3648}
[data-theme="light"] .theme-toggle{
  border-color:rgba(255,255,255,.90);
  background:
    linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.48) 55%, rgba(246,245,251,.40) 100%);
  backdrop-filter:blur(28px) saturate(200%) brightness(1.06);
  -webkit-backdrop-filter:blur(28px) saturate(200%) brightness(1.06);
  box-shadow:
    0 1px 3px rgba(40,30,80,.10),
    0 6px 16px rgba(60,50,120,.08),
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(40,30,80,.06),
    inset 1px 0 0 rgba(255,255,255,.70),
    inset -1px 0 0 rgba(255,255,255,.50);
}
[data-theme="light"] .theme-toggle::before{
  background:linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
  opacity:1;
}
[data-theme="light"] .theme-toggle::after{
  background:
    linear-gradient(135deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.28) 28%, transparent 56%),
    linear-gradient(210deg, transparent 45%, rgba(255,255,255,.18) 75%, transparent 100%);
  mix-blend-mode:normal;
  opacity:1;
}
[data-theme="dark"] .theme-toggle{
  border-color:rgba(255,255,255,.55);
  background:
    linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,.08) 100%);
}
@media (prefers-reduced-motion: reduce){
  .theme-toggle .tt-thumb{transition:none}
  .theme-toggle .tt-icon,.theme-toggle .tt-thumb-face{transition:opacity .12s ease, color .12s ease}
}

/* —— Hero: editorial air (8px rhythm) —— */
.hero{
  margin:0 auto 40px;max-width:640px;
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.hero h1{
  /* v10.15 swap: lighter on "Beta Q&A"; deeper on italic "Center" (both themes). */
  margin:0 0 12px;
  font-family:var(--display);
  font-size:var(--fs-hero);
  font-weight:400;font-style:normal;
  letter-spacing:-.01em;line-height:1.1;
  color:#7C74F0; /* lighter violet — Beta Q&A */
  text-shadow:none;
  text-wrap:balance;
}
.hero h1 em{
  font-family:var(--display);
  font-style:italic;
  font-weight:400;
  letter-spacing:0;
  color:#4338CA; /* deeper violet — Center */
  text-shadow:none;
}
.hero .sub{
  margin:0 0 28px;font-size:16px;font-weight:var(--fw-regular);letter-spacing:-.012em;
  line-height:1.5;color:var(--muted);max-width:400px;
}
.ask-cta{
  display:inline-flex;align-items:center;justify-content:center;
  height:var(--control-h);padding:0 18px;
  border-radius:999px;
  background:var(--cta);color:var(--cta-ink);
  font-size:var(--fs-ui);font-weight:var(--fw-medium);letter-spacing:-.014em;
  border:1px solid var(--cta-border);
  box-shadow:0 1px 2px rgba(24,18,12,.03);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.ask-cta:hover{
  background:var(--cta-hover);transform:translateY(-1px);
  border-color:rgba(99,91,255,.34);
  box-shadow:0 2px 8px rgba(99,91,255,.12);
}
.ask-cta:active{transform:none}

.layout{display:block}
.rail{display:none!important}

/* —— Control band: one clear block —— */
.controls{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin:0 auto 32px;max-width:680px;
}
.chips{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:0;padding:0;max-width:680px;
}
.chip{
  flex:0 0 auto;height:var(--control-h);padding:0 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:var(--fs-ui);font-weight:var(--fw-medium);letter-spacing:-.011em;color:var(--ink-soft);
  white-space:nowrap;box-shadow:var(--shadow-sm);
  overflow:hidden;
  isolation:isolate;
  clip-path:inset(0 round 999px);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.chip:hover{border-color:var(--line2);background:#fff;transform:translateY(-.5px)}
.chip[aria-selected="true"]{
  background:color-mix(in srgb, var(--accent) 12%, #fff);
  border-color:color-mix(in srgb, var(--accent) 28%, transparent);
  color:var(--accent-deep);
  /* No outward purple glow — fill stays inside the pill */
  box-shadow:none;
}

.toolbar{
  display:flex;flex-direction:row;flex-wrap:nowrap;
  align-items:center;justify-content:center;gap:10px;
  margin:0;width:auto;max-width:100%;
}
.search{
  position:relative;display:inline-flex;align-items:center;
  width:auto;height:var(--control-h);padding:0 14px 0 36px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  flex:0 0 auto;max-width:100%;min-width:0;
  overflow:visible;
}
.search:focus-within{
  border-color:color-mix(in srgb, var(--accent) 36%, var(--line));
  box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-sm);
}
.search svg{
  position:absolute;left:13px;width:14px;height:14px;color:var(--faint);pointer-events:none;
}
.search input{
  width:var(--search-input-w, 48ch);height:100%;border:0;outline:0;background:transparent;
  font-size:var(--fs-ui);font-weight:var(--fw-medium);letter-spacing:-.011em;color:var(--ink);
  min-width:0;max-width:none;
  field-sizing:fixed;
  overflow:visible;
  text-overflow:clip;
  white-space:nowrap;
}
.search input::placeholder{color:var(--faint);opacity:1;overflow:visible;text-overflow:clip}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.sort{
  display:inline-flex;align-items:center;height:var(--control-h);padding:3px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  flex:0 0 auto;
}
.sort button{
  height:calc(var(--control-h) - 6px);padding:0 14px;border-radius:999px;
  font-size:var(--fs-ui);font-weight:var(--fw-medium);letter-spacing:-.011em;color:var(--muted);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.sort button[aria-pressed="true"]{
  /* Same selected language as .chip[aria-selected=true] */
  background:color-mix(in srgb, var(--accent) 12%, #fff);
  color:var(--accent-deep);
  box-shadow:none;
}

.sec{
  font-size:12.5px;font-weight:500;letter-spacing:-.008em;
  color:var(--faint);margin:0 0 16px;text-align:center;
  text-transform:none;font-family:var(--font);
}

/* —— Cards —— */
/* Stable dual columns: expand only grows its own column; no reflow flicker. */
#list{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  align-items:start;
}
#list.has-cols{
  grid-template-columns:1fr;
}
@media (min-width:720px){
  #list.has-cols{grid-template-columns:1fr 1fr;gap:16px}
}
#list.is-filtering{opacity:.4;transition:opacity var(--dur) var(--ease)}
.list-col{
  display:flex;flex-direction:column;gap:16px;min-width:0;
}
.item{
  display:block;
  width:100%;
  max-width:100%;
  margin:0;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
  animation:cardIn 200ms var(--ease) both;
}
.item:hover{
  border-color:var(--line2);
  box-shadow:var(--shadow-lg);
  transform:translateY(-1.5px);
}
/* is-new: subtle left accent bar — consistent, no random purple ring */
.item.is-new{
  border-color:var(--line);
  box-shadow:var(--shadow-md);
  position:relative;
}
.item.is-new::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 3px 3px 0;
  background:color-mix(in srgb, var(--accent) 55%, transparent);
  pointer-events:none;
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.item:nth-child(1){animation-delay:0ms}
.item:nth-child(2){animation-delay:24ms}
.item:nth-child(3){animation-delay:48ms}
.item:nth-child(4){animation-delay:72ms}
.item:nth-child(5){animation-delay:96ms}
.item:nth-child(6){animation-delay:120ms}
.item:nth-child(n+7){animation-delay:144ms}

.item summary{
  list-style:none;cursor:pointer;position:relative;
  padding:var(--card-pad-y) 44px var(--card-pad-y) var(--card-pad-x);
}
.item summary::-webkit-details-marker{display:none}
.item summary::after{
  content:"";position:absolute;right:18px;top:26px;
  width:8px;height:8px;
  border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), top var(--dur) var(--ease);
}
.item[open] summary::after{
  transform:rotate(225deg);
  border-color:var(--muted);
  top:30px;
}
.item:hover summary::after{border-color:var(--muted)}
.item .q{
  font-size:var(--fs-title);font-weight:var(--fw-semibold);letter-spacing:-.024em;line-height:var(--lh-title);
  color:var(--ink);margin:0 0 10px;
}
.item .teaser{
  margin:0 0 14px;font-size:var(--fs-ui);font-weight:var(--fw-regular);letter-spacing:-.01em;
  line-height:var(--lh-ui);color:var(--muted);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  overflow:hidden;
}
.item[open] .teaser{display:none}
.item .teaser mark{
  background:transparent;color:var(--ink-soft);font-weight:var(--fw-medium);
}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

/* Light tags — soft violet-neutral chips (coherent with violet aurora); dark keeps green glow */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  height:22px;padding:0 9px 0 8px;
  border-radius:999px;
  border:1px solid rgba(99,91,255,.14);
  background:rgba(99,91,255,.08);
  box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;
  filter:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  font-family:var(--font);font-size:var(--fs-tag);font-weight:var(--fw-medium);
  letter-spacing:-.01em;text-transform:none;
  color:#4338CA;
  line-height:1;
  text-shadow:none;
  transition:background 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.pill::before{
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:#635BFF;
  display:inline-block;flex:0 0 auto;
  box-shadow:0 0 6px rgba(99,91,255,.45);
  filter:none;
}
.pill:hover{background:rgba(99,91,255,.14);color:#3730A3;border-color:rgba(99,91,255,.22)}

.item .body{
  padding:4px var(--card-pad-x) var(--card-pad-y);border-top:1px solid var(--line);
  animation:bodyIn 180ms var(--ease) both;
}
@keyframes bodyIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.item .body p{margin:14px 0 0;font-size:var(--fs-body);letter-spacing:-.01em;line-height:var(--lh-body);color:var(--ink-soft)}
.item .body p:first-child{margin-top:14px}
.item .body code{
  font-family:var(--mono);font-size:var(--fs-meta);padding:1px 5px;border-radius:5px;
  background:rgba(99,91,255,.07);border:1px solid rgba(99,91,255,.11);color:var(--accent-deep);
}
.item .body strong{font-weight:var(--fw-semibold);color:var(--ink)}

.empty{
  flex:1 1 100%;text-align:center;padding:56px 16px;
  color:var(--muted);font-size:14px;letter-spacing:-.01em;
  background:rgba(255,255,255,.45);border:1px dashed var(--line);border-radius:var(--r);
}

footer{
  display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;
  margin:56px 0 0;
  padding:28px 0 0;
  border:0;border-top:1px solid var(--line);
  box-shadow:none;
  font-size:12.5px;color:var(--faint);
}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(16,14,12,.36);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;transition:opacity 200ms var(--ease);
}
.modal-backdrop[hidden]{display:none}
.modal-backdrop.open{opacity:1}
.modal{
  width:min(420px,100%);padding:26px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  transform:translateY(5px);transition:transform 200ms var(--ease);
}
.modal-backdrop.open .modal{transform:none}
.modal h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.modal .hint{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.45}
.modal label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.modal select,.modal textarea{
  width:100%;margin:0 0 14px;padding:10px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);outline:0;
  font-size:13.5px;letter-spacing:-.01em;color:var(--ink-soft);
  transition:border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.modal select:focus,.modal textarea:focus{
  border-color:color-mix(in srgb, var(--accent) 40%, var(--line));
  box-shadow:0 0 0 3px var(--accent-soft);
}
.modal textarea{min-height:100px;resize:vertical}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn{
  height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:500;color:var(--ink-soft);background:transparent;
  transition:background 150ms var(--ease), opacity 150ms var(--ease);
}
.btn:hover{background:rgba(10,10,10,.04)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta-border);box-shadow:0 1px 2px rgba(24,18,12,.03)}
.btn.primary:hover{opacity:.92}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .item:hover{transform:none}
}

/* Dual wordmark */
.brand .wm-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brand .wm-light{display:none}
  :root:not([data-theme="light"]) .brand .wm-dark{display:block}
}
[data-theme="dark"] .brand .wm-light{display:none}
[data-theme="dark"] .brand .wm-dark{display:block}

/* ---- Dark tokens ---- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F14;
    --bg-deep:#090A0E;
    --aurora-top:#0E0F14;
    --surface:#171822;
    --ink:#FFFFFF;
    --ink-soft:#FFFFFF;
    --title:#FFFFFF;
    --muted:#A8A8B3;
    --faint:#7A7A86;
    --line:rgba(246,244,239,.075);
    --line2:rgba(246,244,239,.13);
    --accent:#8B84FF;
    --accent-deep:#B0AAFF;
    --accent-soft:rgba(139,132,255,.18);
    --cta:rgba(139,132,255,.14);
    --cta-ink:#C4BFFF;
    --cta-border:rgba(139,132,255,.28);
    --cta-hover:rgba(139,132,255,.22);
    --control-bg:rgba(23,24,34,.78);
    --ok:#3DB87A;
    --ok-soft:rgba(61,184,122,.2);
    color-scheme:dark;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
    --shadow-md:
      0 1px 2px rgba(0,0,0,.35),
      0 8px 24px rgba(0,0,0,.38);
    --shadow-lg:
      0 2px 6px rgba(0,0,0,.35),
      0 16px 40px rgba(0,0,0,.45);
  }
}
[data-theme="dark"]{
  --bg:#0E0F14;
  --bg-deep:#090A0E;
  --aurora-top:#0E0F14;
  --surface:#171822;
  --ink:#FFFFFF;
  --ink-soft:#FFFFFF;
  --title:#FFFFFF;
  --muted:#A8A8B3;
  --faint:#7A7A86;
  --line:rgba(246,244,239,.075);
  --line2:rgba(246,244,239,.13);
  --accent:#8B84FF;
  --accent-deep:#B0AAFF;
  --accent-soft:rgba(139,132,255,.18);
  --cta:rgba(139,132,255,.14);
  --cta-ink:#C4BFFF;
  --cta-border:rgba(139,132,255,.28);
  --cta-hover:rgba(139,132,255,.22);
  --control-bg:rgba(23,24,34,.78);
  --ok:#3DB87A;
  --ok-soft:rgba(61,184,122,.2);
  color-scheme:dark;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
  --shadow-md:
    0 1px 2px rgba(0,0,0,.35),
    0 8px 24px rgba(0,0,0,.38);
  --shadow-lg:
    0 2px 6px rgba(0,0,0,.35),
    0 16px 40px rgba(0,0,0,.45);
}
[data-theme="light"]{
  color-scheme:light;
}
[data-theme="light"] .hero h1{
  color:#7C74F0; /* lighter violet — Beta Q&A */
  text-shadow:none;
}
[data-theme="light"] .hero h1 em{color:#4338CA;text-shadow:none} /* deeper — Center */
/* Light mode card / control polish — cool clean surfaces (match violet wash) */
[data-theme="light"] .item{
  background:#FFFFFF;
  border-color:rgba(60,50,120,.08);
  box-shadow:
    0 1px 2px rgba(40,30,80,.03),
    0 4px 14px rgba(60,50,120,.045),
    0 16px 36px rgba(60,50,120,.035);
}
[data-theme="light"] .item:hover{
  border-color:rgba(99,91,255,.18);
  box-shadow:
    0 2px 4px rgba(40,30,80,.04),
    0 10px 28px rgba(99,91,255,.08),
    0 28px 56px rgba(60,50,120,.05);
}
[data-theme="light"] .item .body{border-top-color:rgba(60,50,120,.07)}
[data-theme="light"] .chip,
[data-theme="light"] .search,
[data-theme="light"] .sort,
[data-theme="light"] .fresh span{
  background:rgba(255,255,255,.94);
  border-color:rgba(60,50,120,.10);
  box-shadow:0 1px 2px rgba(40,30,80,.03), 0 2px 10px rgba(99,91,255,.05);
}
[data-theme="light"] .chip:hover{
  background:#fff;
  border-color:rgba(99,91,255,.22);
}
/* Light Updated badge — violet status (match purple palette) */
[data-theme="light"] .fresh i{
  background:#635BFF;
  box-shadow:0 0 0 3px rgba(99,91,255,.22);
}
[data-theme="light"] .fresh span{
  color:#5B5678;
  border-color:rgba(99,91,255,.14);
}
/* Light toggle hover — brighter glass */
[data-theme="light"] .theme-toggle:hover{
  background:linear-gradient(180deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.52) 55%, rgba(246,245,251,.42) 100%);
  border-color:rgba(255,255,255,.96);
}
[data-theme="light"] .chip[aria-selected="true"],
[data-theme="light"] .sort button[aria-pressed="true"]{
  /* Unified selected language across chips + Newest/Oldest */
  background:color-mix(in srgb, var(--accent) 14%, #fff);
  border-color:color-mix(in srgb, var(--accent) 28%, transparent);
  outline:none;
  color:var(--accent-deep);
  box-shadow:none;
  overflow:hidden;
}
[data-theme="light"] .chip[aria-selected="true"]{
  border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);
}
[data-theme="light"] .sort button[aria-pressed="true"]{
  /* fill lives inside the shared .sort pill — no extra outer ring */
  border-color:transparent;
}
[data-theme="light"] .pill{
  background:rgba(99,91,255,.08);
  border:1px solid rgba(99,91,255,.14);
  color:#4338CA;
}
[data-theme="light"] .pill::before{background:#635BFF;box-shadow:0 0 6px rgba(99,91,255,.45)}
[data-theme="light"] .pill:hover{background:rgba(99,91,255,.14);color:#3730A3}

/* Dark aurora — original #5B66C4 / #6B78E8 soft wash from physical top (no --aurora-top slab) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .aurora{
    background:linear-gradient(180deg,
      color-mix(in srgb, #5B66C4 32%, var(--bg)) 0%,
      color-mix(in srgb, #5B66C4 22%, var(--bg)) 20%,
      color-mix(in srgb, #6B78E8 12%, var(--bg)) 42%,
      color-mix(in srgb, #4A54B0 5%, var(--bg)) 68%,
      transparent 100%);
    filter:none;opacity:1;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
    mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
  }
  :root:not([data-theme="light"]) #aurora-sticky{
    background:linear-gradient(180deg,
      color-mix(in srgb, #5B66C4 26%, var(--bg)) 0%,
      color-mix(in srgb, #5B66C4 12%, var(--bg)) 55%,
      var(--bg) 100%);
  }
  /* Dark v10.15: lighter gold on Beta Q&A / h1, deeper gold on Center (em) */
  :root:not([data-theme="light"]) .hero h1{color:#FFFBC1;text-shadow:0 0 28px rgba(255,251,193,.18);filter:none}
  :root:not([data-theme="light"]) .hero h1 em{color:#C4B46A;text-shadow:0 0 22px rgba(196,180,106,.16);opacity:1}
}
[data-theme="dark"] .aurora{
  background:linear-gradient(180deg,
    color-mix(in srgb, #5B66C4 32%, var(--bg)) 0%,
    color-mix(in srgb, #5B66C4 22%, var(--bg)) 20%,
    color-mix(in srgb, #6B78E8 12%, var(--bg)) 42%,
    color-mix(in srgb, #4A54B0 5%, var(--bg)) 68%,
    transparent 100%);
  filter:none;opacity:1;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
}
[data-theme="dark"] #aurora-sticky{
  background:linear-gradient(180deg,
    color-mix(in srgb, #5B66C4 26%, var(--bg)) 0%,
    color-mix(in srgb, #5B66C4 12%, var(--bg)) 55%,
    var(--bg) 100%);
}
[data-theme="light"] .aurora{
  background:linear-gradient(180deg,
    color-mix(in srgb, #A898FF 28%, var(--bg)) 0%,
    color-mix(in srgb, #A898FF 18%, var(--bg)) 22%,
    color-mix(in srgb, #B8A8FF 10%, var(--bg)) 48%,
    color-mix(in srgb, #C8BCFF 4%, var(--bg)) 72%,
    transparent 100%);
  filter:none;opacity:1;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 40%,rgba(0,0,0,.55) 70%,transparent 100%);
}
[data-theme="light"] #aurora-sticky{

ces often ship on older firmware (including <code>1.0.68</code>). Send your <strong>serial number (<code>SN</code>)</strong> in <strong>General</strong> or your private <strong>Beta Support</strong> group.</p><p><strong>Wait</strong> for our notice that new firmware was pushed to your device. The app’s Firmware Update screen may not show it right away.</p><p>After that notice, open <strong>Announcements</strong> and follow <code>Checklist_revised.pdf</code> (use the <code>TestFlight</code> build the checklist names). Then keep app and firmware current, and <strong>unbind and re-pair</strong> if data still needs to sync to the Flip screen.</p>","alwaysOpen":false,"tags":["Device","Firmware"]},{"id":"FB-034","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Which iOS app build should I install?","teaser":"Use the listed TestFlight build for iOS beta.","teaserHtml":"Use the listed <mark>TestFlight</mark> build for iOS beta.","a":"<p>Install via <code>TestFlight</code>.</p><p>Current build: <strong>1.0.1 (1217)</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","iOS"]},{"id":"FB-009","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Calendar shows in the app but not on the device — or Bluetooth is connected with no voice actions?","teaser":"Usually an app + firmware mismatch — share SN if asked, then wait for our push.","teaserHtml":"Usually an <mark>app + firmware</mark> mismatch — share SN if asked, then wait for our push.","a":"<p>This is usually an <strong>app and firmware version</strong> mismatch.</p><p>Send your <strong>serial number (<code>SN</code>)</strong> if asked, then <strong>wait for our notification</strong> that a firmware update has been pushed. After the push, calendars listed in the app should be able to sync to the device.</p><p>Android / Fold calendar feedback is noted; <strong>no commitment yet</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","Sync"]},{"id":"FB-028","cat":"app-firmware" /* Size search input to placeholder — snug, last letter fully visible (mobile + desktop) */
(function fitSearchToPlaceholder(){
  if(!qEl) return;
  const wrap=qEl.closest(".search");
  const ph=qEl.getAttribute("placeholder")||"";
  function measure(){
    try{
      const cs=getComputedStyle(qEl);
      const canvas=document.createElement("canvas");
      const ctx=canvas.getContext("2d");
      if(!ctx) return;
      ctx.font=(cs.fontWeight||"400")+" "+(cs.fontSize||"13px")+" "+(cs.fontFamily||"sans-serif");
      /* +8px optical end-cap so last glyph (P) never clips on mobile Safari / desktop */
      const w=Math.ceil(ctx.measureText(ph).width)+8;
      qEl.style.width=w+"px";
      qEl.setAttribute("size", String(Math.max(ph.length, 12)));
      if(wrap){ wrap.style.setProperty("--search-input-w", w+"px"); }
    }catch(e){}
  }
  measure();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(measure).catch(function(){});
  window.addEventListener("resize", measure, {passive:true});
})();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pills(i){const tags=(i.tags&&i.tags.length)?i.tags:[i.tag||LABELS[i.cat]||i.cat];return tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
function cardHtml(i, openIds){
  const teaser=i.teaserHtml||esc(i.teaser);
  const neu=i.sortKey===PAGE_UPDATED?" is-new":"";
  const isOpen=openIds.has(i.id)?" open":"";
  return `<details class="item${neu}" data-id="${esc(i.id)}" data-cat="${esc(i.cat)}"${isOpen}><summary><div class="q">${esc(i.q)}</div><p class="teaser">${teaser}</p><div class="meta">${pills(i)}</div></summary><div class="body">${i.a}</div></details>`;
}
function paint(){
  const q=(qEl.value||"").trim().toLowerCase();
  let items=DATA.slice();
  /* Global search: non-empty query ignores topic tab so matches from all categories show */
  if(q){
    items=items.filter(i=>(i.q+" "+i.a+" "+i.teaser+" "+i.id+" "+(i.tags||[]).join(" ")).toLowerCase().includes(q));
  }else if(tab!=="all"){
    items=items.filter(i=>i.cat===tab);
  }
  items.sort((a,b)=> sortDir==="newest" ? (b.sortKey||"").localeCompare(a.sortKey||"") : (a.sortKey||"").localeCompare(b.sortKey||""));
  if(q) sec.textContent=items.length===1?`1 match across topics`:`${items.length} matches across topics`;
  else sec.textContent=(tab==="all"?`${items.length} answers`:`${items.length} in ${LABELS[tab]||"topic"}`);
  const openIds=new Set(Array.from(list.querySelectorAll("details.item[open]")).map(el=>el.dataset.id).filter(Boolean));
  let left=list.querySelector("#list-left");
  let right=list.querySelector("#list-right");
  if(!left||!right){
    list.innerHTML='<div id="list-left" class="list-col"></div><div id="list-right" class="list-col"></div>';
    left=list.querySelector("#list-left");
    right=list.querySelector("#list-right");
  }
  list.classList.add("has-cols");
  if(!items.length){
    left.innerHTML='';
    right.innerHTML='';
    list.classList.remove("has-cols");
    list.innerHTML='<div class="empty">No matches — try another word or topic.</div>';
    return;
  }
  /* Odd/even split: stable columns — open only pushes within its column */
  const L=[], R=[];
  items.forEach((it,idx)=>{(idx%2===0?L:R).push(it)});
  left.innerHTML=L.map(i=>cardHtml(i,openIds)).join("");
  right.innerHTML=R.map(i=>cardHtml(i,openIds)).join("");
}
function render(opts){if(opts&&opts.soft){list.classList.add("is-filtering");setTimeout(()=>{paint();list.classList.remove("is-filtering")},150)}else paint()}
document.querySelectorAll(".sort button").forEach(btn=>btn.addEventListener("click",()=>{sortDir=btn.dataset.sort;document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"));render({soft:true})}));
qEl.addEventListener("input",()=>render());render();
const modal=document.getElementById("askModal");
function openAsk(){modal.hidden=false;requestAnimationFrame(()=>modal.classList.add("open"));document.getElementById("askQ").focus()}
function closeAsk(){modal.classList.remove("open");setTimeout(()=>{modal.hidden=true},200)}
document.getElementById("askOpen").addEventListener("click",openAsk);
document.getElementById("askCancel").addEventListener("click",closeAsk);
modal.addEventListener("click",e=>{if(e.target===modal)closeAsk()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeAsk()});
document.getElementById("askSubmit").addEventListener("click",()=>{
  const cat=document.getElementById("askCat").value.trim();
  const question=document.getElementById("askQ").value.trim();
  if(!question){document.getElementById("askQ").focus();return}
  const title=`[Beta Q&A] ${cat}: ${question.slice(0,80)}`;
  const body=`### Topic\n${cat}\n\n### Question\n${question}\n\n---\nSubmitted from the Flip Beta Q&A Center. Please add SN / app / firmware if relevant.`;
  window.open(`https://github.com/Ves16Sirius/moonphase-flip-beta-qa/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,"_blank","noopener,noreferrer");
  closeAsk();
});

/* Theme toggle v8 — first visit defaults to DARK (manual-v8).
   Toggle persists light/dark. Prior keys wiped (incl v7). */
(function(){
  const MANUAL='flip-beta-qa-theme-manual-v8';
  const STALE=['flip-beta-qa-theme','flip-beta-qa-theme-v1','flip-beta-qa-theme-v2','flip-beta-qa-theme-manual','flip-beta-qa-theme-v3','flip-beta-qa-theme-manual-v4','flip-beta-qa-theme-manual-v5','flip-beta-qa-theme-manual-v6','flip-beta-qa-theme-manual-v7'];
  const root=document.documentElement;
  const btn=document.getElementById('themeToggle');
  const meta=document.getElementById('themeColorMeta');
  const metaL=document.getElementById('themeColorMetaLight');
  const metaD=document.getElementById('themeColorMetaDark');
  const LIGHT_TC='#F6F5FB'; /* theme-color = --bg */
  const DARK_TC='#0E0F14';
  const LIGHT_BG='#F6F5FB';
  const DARK_BG='#0E0F14';
  for(const k of STALE){try{localStorage.removeItem(k)}catch(e){}}
  function manualPref(){
    try{
      const s=localStorage.getItem(MANUAL);
      return (s==='light'||s==='dark')?s:null;
    }catch(e){return null}
  }
  function current(){
    const a=root.getAttribute('data-theme');
    if(a==='dark'||a==='light') return a;
    return 'dark'; /* default */
  }
  function setThemeColor(theme){
    const tc=theme==='dark'?DARK_TC:LIGHT_TC;
    const bg=theme==='dark'?DARK_BG:LIGHT_BG;
    if(meta) meta.setAttribute('content', tc);
    if(metaL) metaL.setAttribute('content', tc);
    if(metaD) metaD.setAttribute('content', tc);
    try{
      root.style.backgroundColor=bg;
      if(document.body) document.body.style.backgroundColor=bg;
    }catch(e){}
    if(btn){
      btn.setAttribute('aria-label', theme==='dark'?'Switch to light theme':'Switch to dark theme');
      btn.title=theme==='dark'?'Light':'Dark';
    }
  }
  /* Force fixed aurora + sticky wash to repaint with new --bg (Safari compositor lag). */
  function repaintAurora(){
    const nodes=[document.getElementById('aurora'), document.getElementById('aurora-sticky')];
    for(const el of nodes){
      if(!el) continue;
      try{
        el.classList.remove('aurora-repaint');
        void el.offsetHeight;
        el.style.opacity='0.999';
        void el.offsetHeight;
        el.style.opacity='';
        el.classList.add('aurora-repaint');
        void el.offsetHeight;
        el.classList.remove('aurora-repaint');
        /* bounce transform to kick will-change layer */
        const prev=el.style.transform;
        el.style.transform='translateZ(0.1px)';
        void el.offsetHeight;
        el.style.transform=prev||'';
      }catch(e){}
    }
  }
  function applyDefaultDark(){
    root.setAttribute('data-theme', 'dark');
    root.style.colorScheme='dark';
    setThemeColor('dark');
    repaintAurora();
    /* do not persist — first visit only until user toggles */
  }
  function applyManual(theme){
    root.setAttribute('data-theme', theme);
    root.style.colorScheme=theme;
    try{localStorage.setItem(MANUAL, theme)}catch(e){}
    setThemeColor(theme);
    /* double rAF: wait for CSS var/--bg cascade, then force layer redraw */
    requestAnimationFrame(()=>{
      repaintAurora();
      requestAnimationFrame(repaintAurora);
    });
  }
  const saved=manualPref();
  if(saved) applyManual(saved);
  else applyDefaultDark();
  if(btn) btn.addEventListener('click',()=>{
    applyManual(current()==='dark'?'light':'dark');
  });
  /* Persist wash after bfcache / tab return / address-bar resize (iOS) */
  window.addEventListener('pageshow',()=>{repaintAurora()});
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible') repaintAurora();
  });
  if(window.visualViewport){
    let vvT=null;
    window.visualViewport.addEventListener('resize',()=>{
      clearTimeout(vvT);
      vvT=setTimeout(repaintAurora, 60);
    });
  }
})();
