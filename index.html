<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F8F6F3" id="themeColorMeta" />
<title>Moonphase Flip — Beta Q&amp;A Center</title>
<script>
/* Theme bootstrap — system default; localStorage only after explicit toggle */
(function(){
  try{
    var k='flip-beta-qa-theme';
    var saved=localStorage.getItem(k);
    var theme=(saved==='light'||saved==='dark')?saved:
      (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme=theme;
  }catch(e){document.documentElement.setAttribute('data-theme','light')}
})();
</script>
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/index.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" />
<style>
/* Blank-slate v4 — luminous chromatic + voice polish
   System theme default · Geist/Inter display · soft-ink title · soft iris CTA
   Tight mobile safe-area · Flip wordmark · gallery cards */
:root{
  --bg:#F7F5F1;
  --bg-deep:#EFEBE4;
  --surface:#FFFFFF;
  --ink:#1A1917;
  --ink-soft:#2A2825;
  --muted:#7C766E;
  --faint:#A8A29A;
  --line:rgba(12,10,8,.065);
  --line2:rgba(12,10,8,.11);
  --accent:#635BFF;
  --accent-deep:#4F46E5;
  --accent-soft:rgba(99,91,255,.11);
  --cta:rgba(99,91,255,.10);
  --cta-ink:#4F46E5;
  --cta-border:rgba(99,91,255,.22);
  --cta-hover:rgba(99,91,255,.16);
  --ok:#2F9E6B;
  --ok-soft:rgba(47,158,107,.14);
  --shadow-sm:0 1px 2px rgba(24,18,12,.03), 0 2px 8px rgba(24,18,12,.035);
  --shadow-md:
    0 1px 2px rgba(24,18,12,.028),
    0 6px 18px rgba(24,18,12,.045),
    0 18px 40px rgba(90,70,180,.04);
  --shadow-lg:
    0 2px 4px rgba(24,18,12,.03),
    0 14px 36px rgba(24,18,12,.06),
    0 32px 64px rgba(90,70,180,.055);
  --control-bg:rgba(255,255,255,.72);
  --control-h:34px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur:180ms;
  --r:24px;
  --font:"Geist Sans",Geist,Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --display:"Geist Sans",Geist,Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);color-scheme:light dark}
body{
  margin:0;min-height:100vh;color:var(--ink-soft);background:var(--bg);
  font-family:var(--font);font-size:15px;line-height:1.55;font-weight:400;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent-deep);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
::selection{background:var(--accent-soft);color:var(--ink)}

/* Updated bar — quiet silk chip */
.fresh{
  display:flex;justify-content:center;align-items:center;
  padding:max(8px, env(safe-area-inset-top, 0px)) 12px 0;background:transparent;border:0;
}
.fresh span{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 11px;border-radius:999px;
  background:var(--control-bg);
  border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--shadow-sm);
  font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.fresh i{
  width:5px;height:5px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px var(--ok-soft);
  display:inline-block;
  animation:pulse 2.8s var(--ease) infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.shell{
  width:min(880px,100%);margin:0 auto;
  padding:4px 24px max(88px, env(safe-area-inset-bottom, 0px));
  padding-left:max(24px, env(safe-area-inset-left, 0px));
  padding-right:max(24px, env(safe-area-inset-right, 0px));
  position:relative;
}
/* Silk aurora — wide soft wash, heavy blur, no blotch edges */
.shell::before{
  content:"";position:absolute;left:50%;top:-40px;transform:translateX(-50%);
  width:min(1280px,160%);height:520px;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 18% 42%, rgba(168,145,255,.34), transparent 70%),
    radial-gradient(ellipse 60% 50% at 82% 30%, rgba(255,160,195,.26), transparent 68%),
    radial-gradient(ellipse 55% 48% at 50% 58%, rgba(255,200,160,.22), transparent 65%),
    radial-gradient(ellipse 45% 40% at 65% 22%, rgba(255,230,190,.18), transparent 62%),
    radial-gradient(ellipse 40% 38% at 35% 25%, rgba(170,205,255,.16), transparent 68%);
  filter:blur(72px) saturate(108%);
  opacity:.78;
  mask-image:linear-gradient(180deg,#000 0%,#000 42%,transparent 92%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 42%,transparent 92%);
}
/* Fine film grain — silk texture, not blotch */
.shell::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  opacity:.035;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 0 0.03 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mask-image:linear-gradient(180deg,#000 0%,#000 35%,transparent 70%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 35%,transparent 70%);
}
.shell > *{position:relative;z-index:1}
@media (max-width:719px){
  .fresh{padding:max(6px, env(safe-area-inset-top, 0px)) 8px 0}
  .shell{
    padding-top:2px;
    padding-bottom:max(72px, env(safe-area-inset-bottom, 0px));
    padding-left:max(10px, env(safe-area-inset-left, 0px));
    padding-right:max(10px, env(safe-area-inset-right, 0px));
  }
  .shell::before{height:400px;filter:blur(56px) saturate(108%);opacity:.7}
}

/* Brand + premium theme toggle */
.brand{
  display:flex;align-items:center;justify-content:center;
  margin:6px 0 28px;position:relative;min-height:40px;
}
.brand .wm{height:30px;width:auto;display:block}
.theme-toggle{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  height:36px;padding:0 12px 0 10px;border-radius:999px;gap:6px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  color:var(--muted);
  font-size:11px;font-weight:500;letter-spacing:-.01em;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.theme-toggle:hover{
  color:var(--ink);border-color:var(--line2);background:#fff;
  box-shadow:var(--shadow-md);transform:translateY(-50%) scale(1.02);
}
.theme-toggle:active{transform:translateY(-50%)}
.theme-toggle svg{width:15px;height:15px;display:block;flex:0 0 auto}
.theme-toggle .tlabel{display:inline-block;line-height:1}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}
[data-theme="dark"] .theme-toggle .tlabel-dark{display:none}
[data-theme="dark"] .theme-toggle .tlabel-light{display:inline}
.theme-toggle .tlabel-light{display:none}
@media (max-width:719px){
  .brand{margin:2px 0 18px}
  .brand .wm{height:24px}
  .theme-toggle{height:32px;padding:0 9px;gap:0;right:0}
  .theme-toggle .tlabel{display:none!important}
}

/* Hero — calm sculpture, tighter rhythm */
.hero{
  margin:0 auto 36px;max-width:640px;
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.hero h1{
  margin:0 0 12px;
  font-family:var(--display);
  font-size:clamp(2.4rem,5.6vw,3.45rem);
  font-weight:500;font-style:normal;
  letter-spacing:-.045em;line-height:1.05;
  color:var(--ink); /* soft charcoal #1A1917, not pure black */
  text-wrap:balance;
}
.hero .sub{
  margin:0 0 22px;font-size:15.5px;font-weight:400;letter-spacing:-.012em;
  line-height:1.5;color:var(--muted);max-width:380px;
}
.ask-cta{
  display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 18px;
  border-radius:999px;
  background:var(--cta);color:var(--cta-ink);
  font-size:13.5px;font-weight:500;letter-spacing:-.014em;
  border:1px solid var(--cta-border);
  box-shadow:0 1px 2px rgba(24,18,12,.03);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.ask-cta:hover{
  background:var(--cta-hover);transform:translateY(-1px);
  border-color:rgba(99,91,255,.34);
  box-shadow:0 2px 8px rgba(99,91,255,.12);
}
.ask-cta:active{transform:none}
@media (max-width:719px){
  .hero{margin:0 auto 22px}
  .hero h1{font-size:clamp(1.85rem,8.2vw,2.35rem);letter-spacing:-.04em;font-weight:500}
  .hero .sub{font-size:14px;max-width:300px;margin-bottom:16px}
}

.layout{display:block}
.rail{display:none!important}

/* Unified control language — chips + toolbar share surface */
.controls{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  margin:0 auto 28px;max-width:720px;
}
.chips{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin:0;padding:0;max-width:640px;
}
.chip{
  flex:0 0 auto;height:var(--control-h);padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:12.5px;font-weight:500;letter-spacing:-.011em;color:var(--ink-soft);
  white-space:nowrap;box-shadow:var(--shadow-sm);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.chip:hover{border-color:var(--line2);background:#fff;transform:translateY(-.5px)}
.chip[aria-selected="true"]{
  background:color-mix(in srgb, var(--accent) 12%, #fff);
  border-color:color-mix(in srgb, var(--accent) 26%, transparent);
  color:var(--accent-deep);
  box-shadow:0 1px 2px rgba(99,91,255,.06), 0 4px 12px rgba(99,91,255,.08);
}

.toolbar{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin:0;
}
.search{
  position:relative;display:flex;align-items:center;
  width:260px;height:var(--control-h);padding:0 14px 0 34px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.search:focus-within{
  border-color:color-mix(in srgb, var(--accent) 36%, var(--line));
  box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-sm);
}
.search svg{
  position:absolute;left:12px;width:13px;height:13px;color:var(--faint);pointer-events:none;
}
.search input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  font-size:13px;letter-spacing:-.01em;color:var(--ink);
}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
@media (max-width:719px){.search{width:min(280px,100%)}}

.sort{
  display:inline-flex;align-items:center;height:var(--control-h);padding:3px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
}
.sort button{
  height:calc(var(--control-h) - 6px);padding:0 12px;border-radius:999px;
  font-size:12px;font-weight:500;letter-spacing:-.01em;color:var(--muted);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.sort button[aria-pressed="true"]{
  background:color-mix(in srgb, var(--accent) 12%, #fff);
  color:var(--accent-deep);
  box-shadow:0 1px 3px rgba(99,91,255,.08);
}

/* Quiet count — not help-center ALL ANSWERS chrome */
.sec{
  font-size:12px;font-weight:500;letter-spacing:-.008em;
  color:var(--faint);margin:0 0 12px;text-align:center;
  text-transform:none;font-family:var(--font);
}

/* Cards — gallery objects, not FAQ rows */
#list{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
#list.is-filtering{opacity:.4;transition:opacity var(--dur) var(--ease)}
.item{
  flex:1 1 100%;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
  animation:cardIn 200ms var(--ease) both;
}
@media (min-width:720px){.item{flex:1 1 calc(50% - 6px);max-width:calc(50% - 6px)}}
.item:hover{
  border-color:var(--line2);
  box-shadow:var(--shadow-lg);
  transform:translateY(-1.5px);
}
.item.is-new{
  box-shadow:var(--shadow-md), 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.item:nth-child(1){animation-delay:0ms}
.item:nth-child(2){animation-delay:24ms}
.item:nth-child(3){animation-delay:48ms}
.item:nth-child(4){animation-delay:72ms}
.item:nth-child(5){animation-delay:96ms}
.item:nth-child(6){animation-delay:120ms}
.item:nth-child(n+7){animation-delay:144ms}

.item summary{
  list-style:none;cursor:pointer;padding:22px 22px 18px;position:relative;
  padding-right:48px;
}
.item summary::-webkit-details-marker{display:none}
/* Elegant chevron — no filled black disk */
.item summary::after{
  content:"";position:absolute;right:20px;top:24px;
  width:8px;height:8px;
  border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), top var(--dur) var(--ease);
}
.item[open] summary::after{
  transform:rotate(225deg);
  border-color:var(--muted);
  top:28px;
}
.item:hover summary::after{border-color:var(--muted)}
.item .q{
  font-size:15px;font-weight:600;letter-spacing:-.024em;line-height:1.32;
  color:var(--ink);margin:0 0 8px;
}
.item .teaser{
  margin:0 0 14px;font-size:13px;font-weight:400;letter-spacing:-.01em;
  line-height:1.5;color:var(--muted);
}
.item .teaser mark{
  background:transparent;color:var(--ink-soft);font-weight:500;
}
.meta{display:flex;flex-wrap:wrap;gap:6px}

/* Quieter tags — ghost text, no gray pill weight */
.pill{
  display:inline-flex;align-items:center;height:auto;padding:0;
  border-radius:0;border:0;background:transparent;
  font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:-.005em;
  color:var(--faint);line-height:1.2;
  transition:color 150ms var(--ease);
}
.pill + .pill::before{
  content:"·";margin:0 6px 0 0;color:var(--faint);opacity:.55;
}
.pill:hover{color:var(--muted);background:transparent}

.item .body{
  padding:0 22px 22px;border-top:1px solid var(--line);
  animation:bodyIn 180ms var(--ease) both;
}
@keyframes bodyIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.item .body p{margin:14px 0 0;font-size:14px;letter-spacing:-.01em;line-height:1.62;color:var(--ink-soft)}
.item .body p:first-child{margin-top:14px}
.item .body code{
  font-family:var(--mono);font-size:12px;padding:1px 5px;border-radius:5px;
  background:rgba(99,91,255,.07);border:1px solid rgba(99,91,255,.11);color:var(--accent-deep);
}
.item .body strong{font-weight:600;color:var(--ink)}

.empty{
  flex:1 1 100%;text-align:center;padding:56px 16px;
  color:var(--muted);font-size:14px;letter-spacing:-.01em;
  background:rgba(255,255,255,.45);border:1px dashed var(--line);border-radius:var(--r);
}

footer{
  display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;
  margin:44px 0 0;padding:20px 0 0;border-top:1px solid var(--line);
  font-size:12px;color:var(--faint);
}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(16,14,12,.36);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;transition:opacity 200ms var(--ease);
}
.modal-backdrop[hidden]{display:none}
.modal-backdrop.open{opacity:1}
.modal{
  width:min(420px,100%);padding:26px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  transform:translateY(5px);transition:transform 200ms var(--ease);
}
.modal-backdrop.open .modal{transform:none}
.modal h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.modal .hint{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.45}
.modal label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.modal select,.modal textarea{
  width:100%;margin:0 0 14px;padding:10px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);outline:0;
  font-size:13.5px;letter-spacing:-.01em;color:var(--ink-soft);
  transition:border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.modal select:focus,.modal textarea:focus{
  border-color:color-mix(in srgb, var(--accent) 40%, var(--line));
  box-shadow:0 0 0 3px var(--accent-soft);
}
.modal textarea{min-height:100px;resize:vertical}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn{
  height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:500;color:var(--ink-soft);background:transparent;
  transition:background 150ms var(--ease), opacity 150ms var(--ease);
}
.btn:hover{background:rgba(10,10,10,.04)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta-border);box-shadow:0 1px 2px rgba(24,18,12,.03)}
.btn.primary:hover{opacity:.92}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .item:hover{transform:none}
}

/* Dual wordmark */
.brand .wm-dark{display:none}
[data-theme="dark"] .brand .wm-light{display:none}
[data-theme="dark"] .brand .wm-dark{display:block}

/* Dark — luminous, not muddy */
[data-theme="dark"]{
  --bg:#0E0F14;
  --bg-deep:#090A0E;
  --surface:#171822;
  --ink:#EDE9E1; /* soft parchment, not harsh white */
  --ink-soft:#D8D3C9;
  --muted:#9B968E;
  --faint:#6A665F;
  --line:rgba(246,244,239,.075);
  --line2:rgba(246,244,239,.13);
  --accent:#8B84FF;
  --accent-deep:#B0AAFF;
  --accent-soft:rgba(139,132,255,.18);
  --cta:rgba(139,132,255,.14);
  --cta-ink:#C4BFFF;
  --cta-border:rgba(139,132,255,.28);
  --cta-hover:rgba(139,132,255,.22);
  --control-bg:rgba(23,24,34,.78);
  --ok:#3DB87A;
  --ok-soft:rgba(61,184,122,.2);
  color-scheme:dark;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.25);
  --shadow-md:
    0 1px 2px rgba(0,0,0,.35),
    0 8px 24px rgba(0,0,0,.38),
    0 0 0 1px rgba(140,130,255,.04);
  --shadow-lg:
    0 2px 6px rgba(0,0,0,.35),
    0 16px 40px rgba(0,0,0,.45),
    0 0 0 1px rgba(140,130,255,.06);
}
[data-theme="dark"] html,
[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] .shell::before{
  background:
    radial-gradient(ellipse 70% 55% at 18% 42%, rgba(120,105,255,.38), transparent 70%),
    radial-gradient(ellipse 60% 50% at 82% 30%, rgba(210,100,165,.22), transparent 68%),
    radial-gradient(ellipse 55% 48% at 50% 58%, rgba(255,160,110,.12), transparent 65%),
    radial-gradient(ellipse 45% 40% at 65% 22%, rgba(255,200,130,.1), transparent 62%),
    radial-gradient(ellipse 40% 38% at 35% 25%, rgba(110,160,255,.14), transparent 68%);
  filter:blur(80px) saturate(115%);
  opacity:.72;
}
[data-theme="dark"] .shell::after{
  opacity:.05;mix-blend-mode:screen;
}
[data-theme="dark"] .fresh span{
  background:var(--control-bg);border-color:var(--line);color:var(--muted);
}
[data-theme="dark"] .theme-toggle{
  background:var(--control-bg);color:var(--muted);
}
[data-theme="dark"] .theme-toggle:hover{
  background:var(--surface);color:var(--ink);border-color:var(--line2);
}
[data-theme="dark"] .chip{background:var(--control-bg);color:var(--ink-soft)}
[data-theme="dark"] .chip:hover{background:var(--surface)}
[data-theme="dark"] .chip[aria-selected="true"]{
  background:color-mix(in srgb, var(--accent) 18%, var(--surface));
  border-color:color-mix(in srgb, var(--accent) 36%, transparent);
  color:var(--accent-deep);
  box-shadow:0 4px 16px rgba(99,91,255,.14);
}
[data-theme="dark"] .search,
[data-theme="dark"] .sort{background:var(--control-bg)}
[data-theme="dark"] .sort button[aria-pressed="true"]{
  background:color-mix(in srgb, var(--accent) 18%, var(--surface));
  color:var(--accent-deep);
}
[data-theme="dark"] .ask-cta{
  background:var(--cta);color:var(--cta-ink);border-color:var(--cta-border);
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
[data-theme="dark"] .item{
  background:var(--surface);border-color:var(--line);
}
[data-theme="dark"] .item summary::after{border-color:var(--faint)}
[data-theme="dark"] .item[open] summary::after{border-color:var(--muted)}
[data-theme="dark"] .pill{background:transparent;color:var(--faint)}
[data-theme="dark"] .pill:hover{background:transparent;color:var(--muted)}
[data-theme="dark"] .item .body code{
  background:rgba(139,132,255,.12);
  border-color:rgba(139,132,255,.2);
  color:var(--accent-deep);
}
[data-theme="dark"] .empty{background:rgba(23,24,34,.55)}
[data-theme="dark"] .modal{background:var(--surface)}
[data-theme="dark"] .modal select,
[data-theme="dark"] .modal textarea{background:var(--bg-deep);color:var(--ink-soft)}
[data-theme="dark"] .btn.primary{
  background:var(--cta);color:var(--cta-ink);border-color:var(--cta-border);
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
[data-theme="dark"] ::selection{background:var(--accent-soft);color:var(--ink)}
</style>
</head>
<body>
<div class="fresh" role="status"><span><i></i> Updated Oct 24, 2026</span></div>
<div class="shell">
  <div class="brand">
    <img class="wm wm-light" src="wordmark-flip.svg" width="236" height="32" alt="Moonphase Flip" decoding="async" />
    <img class="wm wm-dark" src="wordmark-flip-white.svg" width="236" height="32" alt="Moonphase Flip" decoding="async" />
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark theme" title="Theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span class="tlabel tlabel-dark">Dark</span>
      <span class="tlabel tlabel-light">Light</span>
    </button>
  </div>
  <div class="hero">
    <h1>Beta Q&amp;A Center</h1>
    <p class="sub">Answers for Flip beta testers — search a topic, or open a card.</p>
    <button type="button" class="ask-cta" id="askOpen">Submit a question…</button>
  </div>
  <div class="layout">
    <div class="main">
      <div class="controls">
      <div class="chips" role="tablist" aria-label="Topics">
        <button class="chip" data-tab="all" aria-selected="true">All</button>
        <button class="chip" data-tab="getting-started" aria-selected="false">Getting started</button>
        <button class="chip" data-tab="device" aria-selected="false">Device</button>
        <button class="chip" data-tab="app-firmware" aria-selected="false">App &amp; firmware</button>
        <button class="chip" data-tab="recording-ai" aria-selected="false">Recording &amp; AI</button>
        <button class="chip" data-tab="privacy" aria-selected="false">Privacy</button>
        <button class="chip" data-tab="feedback" aria-selected="false">Reporting</button>
      </div>
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search shipping, firmware, calendar, MCP…" autocomplete="off" />
        </div>
        <div class="sort" role="group" aria-label="Sort order">
          <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
          <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
        </div>
      </div>
      </div>
      <div class="sec" id="sec">11 answers</div>
      <div id="list"></div>
      <footer>
        <span>Moonphase Flip beta support</span>
        <a href="https://hellomoonphase.com/" target="_blank" rel="noopener noreferrer">Official website</a>
      </footer>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="askModal" role="dialog" aria-modal="true" aria-labelledby="askTitle" hidden>
  <div class="modal">
    <h2 id="askTitle">Submit a question</h2>
    <p class="hint">Opens a GitHub Issue for the team to triage — no WhatsApp required.</p>
    <label for="askCat">Category</label>
    <select id="askCat">
      <option value="Getting started">Getting started</option>
      <option value="Device">Device</option>
      <option value="App &amp; firmware">App &amp; firmware</option>
      <option value="Recording &amp; AI">Recording &amp; AI</option>
      <option value="Privacy &amp; MCP">Privacy &amp; MCP</option>
      <option value="How to report">How to report</option>
      <option value="Other">Other</option>
    </select>
    <label for="askQ">Your question</label>
    <textarea id="askQ" placeholder="What do you need help with?" maxlength="2000"></textarea>
    <div class="row">
      <button type="button" class="btn" id="askCancel">Cancel</button>
      <button type="button" class="btn primary" id="askSubmit">Continue to GitHub</button>
    </div>
  </div>
</div>

<script>


const PAGE_UPDATED="2026-10-24";
const LABELS={"all":"All answers","getting-started":"Getting started","device":"Device","app-firmware":"App & firmware","recording-ai":"Recording & AI","privacy":"Privacy","feedback":"Reporting"};
const DATA=[{"id":"FB-004","cat":"getting-started","tag":"Getting started","sortKey":"2026-10-22","q":"How do I track shipping, and where do I report bugs?","teaser":"UPS delivery; tracking arrives by email. Report bugs in General or Beta Support.","teaserHtml":"<mark>UPS</mark> delivery; tracking arrives by email. Report bugs in <mark>General</mark> or <mark>Beta Support</mark>.","a":"<p>Units ship with <code>UPS</code>. You’ll get an email from the team; tracking can take a little while to appear.</p><p>For bugs, post in <strong>General</strong> or your personal <strong>Beta Support</strong> group.</p>","alwaysOpen":false,"tags":["Getting started","Shipping"]},{"id":"FB-035","cat":"getting-started","tag":"Getting started","sortKey":"2026-10-24","q":"My device just arrived — what should I do first?","teaser":"Share your SN, wait for our push notice, then follow Checklist_revised.pdf.","teaserHtml":"Share your <mark>SN</mark>, wait for our push notice, then follow <mark>Checklist_revised.pdf</mark>.","a":"<p>Send your device <strong>serial number (<code>SN</code>)</strong> in <strong>General</strong> or your private <strong>Beta Support</strong> group so we can push firmware to your unit.</p><p><strong>Wait</strong> until we confirm the firmware push is ready — don’t skip ahead.</p><p>Then open <strong>Announcements</strong> and follow <code>Checklist_revised.pdf</code> (plus QuickStart / Checklist as needed). After updating, keep app and firmware current; unbind and re-pair if the screen still needs a sync.</p>","alwaysOpen":false,"tags":["Getting started","Setup"]},{"id":"FB-014","cat":"device","tag":"Device","sortKey":"2026-10-24","q":"Recording shows activity, but nothing returns — or I’m stuck on firmware 1.0.68?","teaser":"Share your SN, wait for our firmware-push notice, then follow Checklist_revised.pdf.","teaserHtml":"Share your <mark>SN</mark>, wait for our firmware-push notice, then follow <mark>Checklist_revised.pdf</mark>.","a":"<p>Devices often ship on older firmware (including <code>1.0.68</code>). Send your <strong>serial number (<code>SN</code>)</strong> in <strong>General</strong> or your private <strong>Beta Support</strong> group.</p><p><strong>Wait</strong> for our notice that new firmware was pushed to your unit. The app’s Firmware Update screen may not show it right away.</p><p>After that notice, open <strong>Announcements</strong> and follow <code>Checklist_revised.pdf</code> (use the <code>TestFlight</code> build the checklist names). Then keep app and firmware current, and <strong>unbind and re-pair</strong> if data still needs to sync to the Flip screen.</p>","alwaysOpen":false,"tags":["Device","Firmware"]},{"id":"FB-034","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Which iOS app build should I install?","teaser":"Use the listed TestFlight build for iOS beta.","teaserHtml":"Use the listed <mark>TestFlight</mark> build for iOS beta.","a":"<p>Install via <code>TestFlight</code>.</p><p>Current build: <strong>1.0.1 (1217)</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","iOS"]},{"id":"FB-009","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Calendar shows in the app but not on the device — or Bluetooth is connected with no voice actions?","teaser":"Usually an app + firmware mismatch — share SN if asked, then wait for our push.","teaserHtml":"Usually an <mark>app + firmware</mark> mismatch — share SN if asked, then wait for our push.","a":"<p>This is usually an <strong>app and firmware version</strong> mismatch.</p><p>Send your <strong>serial number (<code>SN</code>)</strong> if asked, then <strong>wait for our notification</strong> that a firmware update has been pushed. After the push, calendars listed in the app should be able to sync to the device.</p><p>Android / Fold calendar feedback is noted; <strong>no commitment yet</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","Sync"]},{"id":"FB-028","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Why do I see characters in other languages in the UI or AI output?","teaser":"Known AI language/prompt issue under fix — send a screenshot if it returns.","teaserHtml":"Known AI language/prompt issue under fix — send a screenshot if it returns.","a":"<p>Characters in other languages in the UI or AI output are treated as an <strong>AI language / prompt</strong> issue. The team is refining prompts.</p><p>If it continues, send a screenshot in <strong>General</strong> or your personal <strong>Beta Support</strong> group.</p>","alwaysOpen":false,"tags":["App & firmware","AI"]},{"id":"FB-015","cat":"recording-ai","tag":"Recording & AI","sortKey":"2026-10-23","q":"Can I leave recording on all day?","teaser":"Yes — it keeps speech only and clears after phone sync.","teaserHtml":"Yes — it keeps speech only and clears after phone sync.","a":"<p>Yes. Leave recording on.</p><p>It <strong>only keeps audio when someone is speaking</strong>. After sync to your phone, device storage <strong>clears automatically</strong>.</p>","alwaysOpen":false,"tags":["Recording & AI","Battery"]},{"id":"FB-024","cat":"privacy","tag":"Privacy","sortKey":"2026-10-24","q":"Can I use Flip with other AIs via MCP under the NDA?","teaser":"Yes — MCP with other AIs is allowed in this beta.","teaserHtml":"Yes — <mark>MCP</mark> with other AIs is allowed in this beta.","a":"<p><code>MCP</code> is part of the beta. You’re free to try it with other AIs.</p>","alwaysOpen":false,"tags":["Privacy","MCP"]},{"id":"R1","cat":"feedback","tag":"Reporting","sortKey":"2026-10-22","q":"General channel","teaser":"Shared questions, announcements, and group bug reports.","teaserHtml":"Shared questions, announcements, and group bug reports.","a":"<p>Use <strong>General</strong> for shared questions, announcements, and bug reports the whole beta group can see.</p>","alwaysOpen":false,"tags":["Reporting","General"]},{"id":"R2","cat":"feedback","tag":"Reporting","sortKey":"2026-10-22","q":"Personal Beta Support group","teaser":"Private thread for shipment, SN, and one-to-one issues.","teaserHtml":"Private thread for shipment, <mark>SN</mark>, and one-to-one issues.","a":"<p>Your private thread for shipment details, <strong>serial number (<code>SN</code>)</strong>, and one-to-one issues.</p>","alwaysOpen":false,"tags":["Reporting","Support"]},{"id":"R3","cat":"feedback","tag":"Reporting","sortKey":"2026-10-24","q":"Which docs matter, and what should I include when reporting?","teaser":"Include SN, versions, and a screenshot; checklists live in Announcements.","teaserHtml":"Include SN, versions, and a screenshot; checklists live in Announcements.","a":"<p><strong>Announcements</strong> includes <code>Checklist.pdf</code>, <code>QuickStartGuide.pdf</code>, and <code>Checklist_revised.pdf</code> after firmware pushes.</p><p>Helpful reports include repro steps, your <strong>serial number (<code>SN</code>)</strong>, app and firmware versions, and a screenshot or short video.</p>","alwaysOpen":false,"tags":["Reporting","Docs"]}];
let tab="all", sortDir="newest";
const list=document.getElementById("list"), qEl=document.getElementById("q"), sec=document.getElementById("sec");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pills(i){const tags=(i.tags&&i.tags.length)?i.tags:[i.tag||LABELS[i.cat]||i.cat];return tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
function paint(){
  const q=(qEl.value||"").trim().toLowerCase();
  let items=DATA.slice();
  if(tab!=="all")items=items.filter(i=>i.cat===tab);
  if(q)items=items.filter(i=>(i.q+" "+i.a+" "+i.teaser+" "+i.id+" "+(i.tags||[]).join(" ")).toLowerCase().includes(q));
  items.sort((a,b)=> sortDir==="newest" ? (b.sortKey||"").localeCompare(a.sortKey||"") : (a.sortKey||"").localeCompare(b.sortKey||""));
  sec.textContent=(tab==="all"?`${items.length} answers`:`${items.length} in ${LABELS[tab]||"topic"}`);
  const openIds=new Set(Array.from(list.querySelectorAll("details.item[open]")).map(el=>el.dataset.id).filter(Boolean));
  if(!items.length){list.innerHTML='<div class="empty">No matches — try another word or topic.</div>';return}
  list.innerHTML=items.map(i=>{
    const teaser=i.teaserHtml||esc(i.teaser);
    const neu=i.sortKey===PAGE_UPDATED?" is-new":"";
    const isOpen=openIds.has(i.id)?" open":"";
    return `<details class="item${neu}" data-id="${esc(i.id)}" data-cat="${esc(i.cat)}"${isOpen}><summary><div class="q">${esc(i.q)}</div><p class="teaser">${teaser}</p><div class="meta">${pills(i)}</div></summary><div class="body">${i.a}</div></details>`;
  }).join("");
}
function render(opts){if(opts&&opts.soft){list.classList.add("is-filtering");setTimeout(()=>{paint();list.classList.remove("is-filtering")},150)}else paint()}
document.querySelectorAll(".sort button").forEach(btn=>btn.addEventListener("click",()=>{sortDir=btn.dataset.sort;document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"));render({soft:true})}));
qEl.addEventListener("input",()=>render());render();
const modal=document.getElementById("askModal");
function openAsk(){modal.hidden=false;requestAnimationFrame(()=>modal.classList.add("open"));document.getElementById("askQ").focus()}
function closeAsk(){modal.classList.remove("open");setTimeout(()=>{modal.hidden=true},200)}
document.getElementById("askOpen").addEventListener("click",openAsk);
document.getElementById("askCancel").addEventListener("click",closeAsk);
modal.addEventListener("click",e=>{if(e.target===modal)closeAsk()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeAsk()});
document.getElementById("askSubmit").addEventListener("click",()=>{
  const cat=document.getElementById("askCat").value.trim();
  const question=document.getElementById("askQ").value.trim();
  if(!question){document.getElementById("askQ").focus();return}
  const title=`[Beta Q&A] ${cat}: ${question.slice(0,80)}`;
  const body=`### Category\n${cat}\n\n### Question\n${question}\n\n---\nSubmitted from the public Beta Q&A Center.`;
  window.open(`https://github.com/Ves16Sirius/moonphase-flip-beta-qa/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,"_blank","noopener,noreferrer");
  closeAsk();
});
/* fresh bar is non-sticky silk — no scroll hide */

/* Theme toggle — system until user toggles; then persist; follow OS if no key */
(function(){
  const KEY='flip-beta-qa-theme';
  const root=document.documentElement;
  const btn=document.getElementById('themeToggle');
  const meta=document.getElementById('themeColorMeta');
  function current(){return root.getAttribute('data-theme')==='dark'?'dark':'light'}
  function apply(theme, persist){
    root.setAttribute('data-theme', theme);
    root.style.colorScheme=theme;
    if(meta) meta.setAttribute('content', theme==='dark'?'#0E0F14':'#F7F5F1');
    if(btn){
      btn.setAttribute('aria-label', theme==='dark'?'Switch to light theme':'Switch to dark theme');
      btn.title=theme==='dark'?'Light':'Dark';
    }
    if(persist){try{localStorage.setItem(KEY, theme)}catch(e){}}
  }
  apply(current(), false);
  if(btn) btn.addEventListener('click',()=>apply(current()==='dark'?'light':'dark', true));
  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e=>{
      let saved=null;try{saved=localStorage.getItem(KEY)}catch(err){}
      if(saved!=='light'&&saved!=='dark') apply(e.matches?'dark':'light', false);
    });
  }catch(e){}
})();



/* Category chips */
document.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
  tab=btn.dataset.tab;
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab?"true":"false"));
  render({soft:true});
}));

</script>
</body>
</html>
