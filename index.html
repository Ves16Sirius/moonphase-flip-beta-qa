<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1A1612" media="(prefers-color-scheme: dark)" />
<title>Moonphase Flip — Beta Q&amp;A Center</title>
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* From-scratch system: Moonphase brand cream/brown + Anthropic paper warmth + Linear density */
:root{
  --bg:#F6F4F1;
  --bg-glow:rgba(255,251,193,.28);
  --elev:#FFFdf9;
  --soft:#F0EBE3;
  --ink:#402F1E;
  --soft-ink:#5C4A38;
  --muted:#7F715C;
  --faint:#9D968B;
  --line:rgba(64,47,30,.10);
  --line2:rgba(64,47,30,.16);
  --accent:#C4A84A;
  --accent-soft:rgba(196,168,74,.18);
  --gold:#FFFBC1;
  --link:#0B66C2;
  --ok:#5C7A3A;
  --ease:cubic-bezier(.22,1,.36,1);
  --dur:200ms;
  --r:12px;
  --pill:999px;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:48px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1A1612;--bg-glow:rgba(245,230,163,.06);
  --elev:#241F1A;--soft:#2E2822;
  --ink:#F3EDE3;--soft-ink:#E8DFD2;--muted:#B5A794;--faint:#8A7F70;
  --line:rgba(243,237,227,.10);--line2:rgba(243,237,227,.16);
  --accent:#F5E6A3;--accent-soft:rgba(245,230,163,.16);--gold:#F5E6A3;
  --link:#6CB6FF;--ok:#A3C47A;color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-size:15px;line-height:1.5;font-weight:400;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(820px 420px at 50% -10%, var(--bg-glow), transparent 60%);
}
.fresh{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:center;align-items:center;height:40px;padding:0 18px;
  background:color-mix(in srgb,var(--elev) 88%, transparent);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
  transform:translate3d(0,0,0);opacity:1;
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
  will-change:transform,opacity;backface-visibility:hidden;pointer-events:none;
}
.fresh.away{transform:translate3d(0,-100%,0);opacity:0}
.fresh span{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--muted);pointer-events:auto}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);font-style:normal}
.shell{max-width:1180px;margin:0 auto;padding:var(--s4) var(--s3) 112px}
.brand{margin:0 0 var(--s3)}
.wm{display:block;height:40px;width:auto}
.wm-dark{display:none}
@media (prefers-color-scheme:dark){.wm-light{display:none}.wm-dark{display:block}}
.hero{margin:0 0 var(--s5);max-width:36em}
h1{
  margin:0 0 12px;font-size:clamp(2rem,3.8vw,2.75rem);
  font-weight:600;letter-spacing:-.04em;line-height:1.08;color:var(--ink);
}
.sub{margin:0 0 var(--s3);font-size:16px;line-height:1.55;color:var(--muted);letter-spacing:-.014em}
.ask-cta{
  display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:var(--pill);
  border:0;background:var(--ink);color:var(--elev);
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.ask-cta:hover{opacity:.9;transform:translateY(-1px)}
.ask-cta:active{transform:none}
.layout{display:block}
.rail{margin:0 0 var(--s3)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.search{
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  width:260px;max-width:calc(100vw - 44px);height:36px;padding:0 14px;
  border:1px solid var(--line2);border-radius:var(--pill);background:var(--elev);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
.search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.search > svg{flex:0 0 auto;width:14px;height:14px;color:var(--faint);pointer-events:none}
.search input[type=search]{
  flex:1 1 auto;min-width:0;width:auto !important;height:100%;margin:0;padding:0 !important;
  border:0 !important;border-radius:0 !important;background:transparent !important;box-shadow:none !important;outline:none;
  color:var(--ink);font:inherit;font-size:14px;-webkit-appearance:none;appearance:none;
}
.search input[type=search]::placeholder{color:var(--faint)}
.search input[type=search]::-webkit-search-decoration,
.search input[type=search]::-webkit-search-cancel-button{display:none}
input[type=search],select,textarea,input[type=text]{
  width:100%;background:var(--elev);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;outline:none;
}
input[type=search]:focus,select:focus,textarea:focus,input[type=text]:focus{
  border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft);
}
.sort{
  display:inline-flex;align-items:center;height:36px;padding:3px;gap:2px;
  border-radius:var(--pill);border:1px solid var(--line);background:var(--soft);
}
.sort button{
  appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;
  font-size:12px;font-weight:500;height:28px;padding:0 12px;border-radius:var(--pill);cursor:pointer;
  transition:color var(--dur) var(--ease),background var(--dur) var(--ease);
}
.sort button:hover{color:var(--ink)}
.sort button[aria-pressed=true]{background:var(--elev);color:var(--ink);box-shadow:0 1px 2px rgba(64,47,30,.06)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{
  appearance:none;height:32px;padding:0 14px;border-radius:var(--pill);
  border:1px solid var(--line);background:var(--elev);color:var(--soft-ink);
  font:inherit;font-size:12px;font-weight:500;cursor:pointer;text-align:left;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease);
}
.cat:hover{border-color:var(--line2);color:var(--ink)}
.cat[aria-selected=true]{
  background:var(--accent-soft);color:var(--ink);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));
}
.cat .l{display:block}.cat .h{display:none}
.sec{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
#list{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;transition:opacity 150ms var(--ease)}
#list.is-filtering{opacity:.4;pointer-events:none}
.item{
  flex:1 1 100%;width:100%;background:var(--elev);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 2px rgba(64,47,30,.03);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
.item:hover{border-color:var(--line2);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 10px 28px rgba(64,47,30,.06)}
.item.is-new{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.item summary{list-style:none;cursor:pointer;padding:18px;display:grid;gap:10px;outline:none}
.item summary::-webkit-details-marker{display:none}
.item summary:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-soft);border-radius:var(--r)}
.item .q{font-size:15px;font-weight:500;letter-spacing:-.022em;line-height:1.35;color:var(--ink);padding-right:26px;position:relative}
.item summary .q::after{content:"+";position:absolute;right:0;top:0;color:var(--faint);font-size:1.15rem;line-height:1;font-weight:400}
.item[open] summary .q::after{content:"–";color:var(--ink)}
.item .teaser{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.item .teaser mark,.item .teaser strong{background:var(--accent-soft);color:var(--ink);font-weight:500;padding:.05em .28em;border-radius:4px}
.item .body{padding:0 18px 18px;border-top:1px solid var(--line);color:var(--soft-ink);font-size:14.5px;line-height:1.65;animation:bodyIn var(--dur) var(--ease)}
@keyframes bodyIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.item .body > *:first-child{margin-top:14px}
.item .body p{margin:0 0 12px}.item .body p:last-child{margin-bottom:0}
.item .body strong{color:var(--ink);font-weight:600}
.item .body code{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;font-weight:500;
  padding:.12em .4em;border-radius:5px;background:var(--soft);border:1px solid var(--line);color:var(--ink);white-space:nowrap;
}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{
  display:inline-flex;align-items:center;font-size:11px;font-weight:500;line-height:1;
  padding:6px 10px;border-radius:var(--pill);color:var(--soft-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.35));
  border:1px solid var(--line2);box-shadow:0 1px 0 rgba(255,255,255,.55) inset;
}
@media (prefers-color-scheme:dark){
  .pill{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));color:var(--ink)}
  .item{box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35)}
}
.empty{color:var(--muted);padding:56px 8px;text-align:center;flex:1 1 100%}
footer{margin-top:56px;padding:24px 0 8px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer a{color:var(--link);text-decoration:none}footer a:hover{text-decoration:underline}
.modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(64,47,30,.4);display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.open{display:flex}
.modal{width:min(440px,100%);background:var(--elev);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 64px rgba(64,47,30,.16);padding:22px}
.modal h2{font-weight:600;font-size:1.25rem;letter-spacing:-.03em;margin:0 0 6px}
.modal p.hint{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.5}
.modal label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:14px 0 6px}
.modal textarea{min-height:100px;resize:vertical}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .btn{appearance:none;height:34px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--soft);color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.modal .btn.primary{background:var(--ink);color:var(--elev);border-color:var(--ink)}
@media (min-width:720px){.item{flex:1 1 calc(50% - 6px);max-width:calc(50% - 6px)}}
@media (min-width:1100px){
  .shell{padding:var(--s5) 40px 128px}
  .layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
  .rail{position:sticky;top:56px;margin:0}
  .cats{flex-direction:column;flex-wrap:nowrap;gap:6px}
  .cat{height:auto;min-height:38px;width:100%;padding:9px 12px;border-radius:10px}
  .cat .h{display:block;margin-top:2px;font-size:11px;font-weight:400;color:var(--faint);line-height:1.3}
  .cat[aria-selected=true] .h{color:var(--muted)}
  .wm{height:44px}.search{width:280px}.toolbar{justify-content:flex-start}
}
@media (max-width:1099px){
  .toolbar{flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%}
  .search{width:min(280px,calc(100vw - 36px));height:36px;border-radius:var(--pill);margin-left:auto;margin-right:auto}
  .sort{margin-left:auto;margin-right:auto}
  .rail{display:flex;justify-content:center;width:100%}
  .cats{justify-content:center;max-width:100%;margin-left:auto;margin-right:auto}
}
@media (max-width:719px){
  .shell{padding:28px 16px 88px}
  .brand{display:flex;justify-content:center}
  .hero{text-align:center;margin-left:auto;margin-right:auto}
  .search input[type=search]{font-size:16px}
  h1{font-size:clamp(1.75rem,7.5vw,2.2rem)}
  .sub{font-size:15px}
  .item{flex:1 1 100%;max-width:100%}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fresh,.ask-cta,.item,.cat,.item .body,#list{transition:none!important;animation:none!important}
  .fresh.away{transform:none;opacity:0}
  .ask-cta:hover{transform:none}
}
</style>
</head>
<body>
<div class="fresh" role="status"><span><i></i> Updated Oct 24, 2026</span></div>
<div class="shell">
  <div class="brand">
    <img class="wm wm-light" src="moonface-m.png" srcset="moonface-m.png 1x, moonface-m@2x.png 2x" width="90" height="72" alt="Moonphase" />
    <img class="wm wm-dark" src="moonface-m-white.png" srcset="moonface-m-white.png 1x, moonface-m-white@2x.png 2x" width="90" height="72" alt="Moonphase" />
  </div>
  <div class="hero">
    <h1>Beta Q&amp;A Center</h1>
    <p class="sub">Official answers for Moonphase Flip testers. Search by topic, sort by date, and open a card for the full answer.</p>
    <button type="button" class="ask-cta" id="askOpen">Submit a question for the team</button>
  </div>
  <div class="layout">
    <aside class="rail" aria-label="Topics">
      <div class="cats" role="tablist">
        <button class="cat" data-tab="all" aria-selected="true"><span class="l">All</span><span class="h">All topics</span></button>
        <button class="cat" data-tab="getting-started" aria-selected="false"><span class="l">Getting started</span><span class="h">Setup &amp; shipping</span></button>
        <button class="cat" data-tab="device" aria-selected="false"><span class="l">Device</span><span class="h">Hardware recovery</span></button>
        <button class="cat" data-tab="app-firmware" aria-selected="false"><span class="l">App &amp; firmware</span><span class="h">Updates &amp; sync</span></button>
        <button class="cat" data-tab="recording-ai" aria-selected="false"><span class="l">Recording &amp; AI</span><span class="h">Capture &amp; storage</span></button>
        <button class="cat" data-tab="privacy" aria-selected="false"><span class="l">Privacy</span><span class="h">Data &amp; MCP</span></button>
        <button class="cat" data-tab="feedback" aria-selected="false"><span class="l">Reporting</span><span class="h">Channels &amp; tips</span></button>
      </div>
    </aside>
    <div class="main">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search shipping, firmware, calendar, MCP…" autocomplete="off" />
        </div>
        <div class="sort" role="group" aria-label="Sort order">
          <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
          <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
        </div>
      </div>
      <div class="sec" id="sec">All answers</div>
      <div id="list"></div>
      <footer>
        <span>Moonphase Flip beta support</span>
        <a href="https://hellomoonphase.com/" target="_blank" rel="noopener noreferrer">Official website</a>
      </footer>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="askModal" role="dialog" aria-modal="true" aria-labelledby="askTitle" hidden>
  <div class="modal">
    <h2 id="askTitle">Submit a question</h2>
    <p class="hint">Opens a GitHub Issue for the team to triage — no WhatsApp required.</p>
    <label for="askCat">Category</label>
    <select id="askCat">
      <option value="Getting started">Getting started</option>
      <option value="Device">Device</option>
      <option value="App &amp; firmware">App &amp; firmware</option>
      <option value="Recording &amp; AI">Recording &amp; AI</option>
      <option value="Privacy &amp; MCP">Privacy &amp; MCP</option>
      <option value="How to report">How to report</option>
      <option value="Other">Other</option>
    </select>
    <label for="askQ">Your question</label>
    <textarea id="askQ" placeholder="What do you need help with?" maxlength="2000"></textarea>
    <div class="row">
      <button type="button" class="btn" id="askCancel">Cancel</button>
      <button type="button" class="btn primary" id="askSubmit">Continue to GitHub</button>
    </div>
  </div>
</div>
<script>
const PAGE_UPDATED="2026-10-24";
const LABELS={"all":"All answers","getting-started":"Getting started","device":"Device","app-firmware":"App & firmware","recording-ai":"Recording & AI","privacy":"Privacy","feedback":"Reporting"};
const DATA=[{"id":"FB-004","cat":"getting-started","tag":"Getting started","sortKey":"2026-10-22","q":"How do I track shipping, and where do I report bugs?","teaser":"UPS delivery; tracking arrives by email. Report bugs in General or Beta Support.","teaserHtml":"<mark>UPS</mark> delivery; tracking arrives by email. Report bugs in <mark>General</mark> or <mark>Beta Support</mark>.","a":"<p>Units ship with <code>UPS</code>. You’ll get an email from the team; tracking can take a little while to appear.</p><p>For bugs, post in <strong>General</strong> or your personal <strong>Beta Support</strong> group.</p>","alwaysOpen":false,"tags":["Getting started","Shipping"]},{"id":"FB-035","cat":"getting-started","tag":"Getting started","sortKey":"2026-10-24","q":"My device just arrived — what should I do first?","teaser":"Share your SN, wait for our push notice, then follow Checklist_revised.pdf.","teaserHtml":"Share your <mark>SN</mark>, wait for our push notice, then follow <mark>Checklist_revised.pdf</mark>.","a":"<p>Send your device <strong>serial number (<code>SN</code>)</strong> in <strong>General</strong> or your private <strong>Beta Support</strong> group so we can push firmware to your unit.</p><p><strong>Wait</strong> until we confirm the firmware push is ready — don’t skip ahead.</p><p>Then open <strong>Announcements</strong> and follow <code>Checklist_revised.pdf</code> (plus QuickStart / Checklist as needed). After updating, keep app and firmware current; unbind and re-pair if the screen still needs a sync.</p>","alwaysOpen":false,"tags":["Getting started","Setup"]},{"id":"FB-014","cat":"device","tag":"Device","sortKey":"2026-10-24","q":"Recording shows activity, but nothing returns — or I’m stuck on firmware 1.0.68?","teaser":"Share your SN, wait for our firmware-push notice, then follow Checklist_revised.pdf.","teaserHtml":"Share your <mark>SN</mark>, wait for our firmware-push notice, then follow <mark>Checklist_revised.pdf</mark>.","a":"<p>Devices often ship on older firmware (including <code>1.0.68</code>). Send your <strong>serial number (<code>SN</code>)</strong> in <strong>General</strong> or your private <strong>Beta Support</strong> group.</p><p><strong>Wait</strong> for our notice that new firmware was pushed to your unit. The app’s Firmware Update screen may not show it right away.</p><p>After that notice, open <strong>Announcements</strong> and follow <code>Checklist_revised.pdf</code> (use the <code>TestFlight</code> build the checklist names). Then keep app and firmware current, and <strong>unbind and re-pair</strong> if data still needs to sync to the Flip screen.</p>","alwaysOpen":false,"tags":["Device","Firmware"]},{"id":"FB-034","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Which iOS app build should I install?","teaser":"Use the listed TestFlight build for iOS beta.","teaserHtml":"Use the listed <mark>TestFlight</mark> build for iOS beta.","a":"<p>Install via <code>TestFlight</code>.</p><p>Current build: <strong>1.0.1 (1217)</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","iOS"]},{"id":"FB-009","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Calendar shows in the app but not on the device — or Bluetooth is connected with no voice actions?","teaser":"Usually an app + firmware mismatch — share SN if asked, then wait for our push.","teaserHtml":"Usually an <mark>app + firmware</mark> mismatch — share SN if asked, then wait for our push.","a":"<p>This is usually an <strong>app and firmware version</strong> mismatch.</p><p>Send your <strong>serial number (<code>SN</code>)</strong> if asked, then <strong>wait for our notification</strong> that a firmware update has been pushed. After the push, calendars listed in the app should be able to sync to the device.</p><p>Android / Fold calendar feedback is noted; <strong>no commitment yet</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","Sync"]},{"id":"FB-028","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Why do I see characters in other languages in the UI or AI output?","teaser":"Known AI language/prompt issue under fix — send a screenshot if it returns.","teaserHtml":"Known AI language/prompt issue under fix — send a screenshot if it returns.","a":"<p>Characters in other languages in the UI or AI output are treated as an <strong>AI language / prompt</strong> issue. The team is refining prompts.</p><p>If it continues, send a screenshot in <strong>General</strong> or your personal <strong>Beta Support</strong> group.</p>","alwaysOpen":false,"tags":["App & firmware","AI"]},{"id":"FB-015","cat":"recording-ai","tag":"Recording & AI","sortKey":"2026-10-23","q":"Can I leave recording on all day?","teaser":"Yes — it keeps speech only and clears after phone sync.","teaserHtml":"Yes — it keeps speech only and clears after phone sync.","a":"<p>Yes. Leave recording on.</p><p>It <strong>only keeps audio when someone is speaking</strong>. After sync to your phone, device storage <strong>clears automatically</strong>.</p>","alwaysOpen":false,"tags":["Recording & AI","Battery"]},{"id":"FB-024","cat":"privacy","tag":"Privacy","sortKey":"2026-10-24","q":"Can I use Flip with other AIs via MCP under the NDA?","teaser":"Yes — MCP with other AIs is allowed in this beta.","teaserHtml":"Yes — <mark>MCP</mark> with other AIs is allowed in this beta.","a":"<p><code>MCP</code> is part of the beta. You’re free to try it with other AIs.</p>","alwaysOpen":false,"tags":["Privacy","MCP"]},{"id":"R1","cat":"feedback","tag":"Reporting","sortKey":"2026-10-22","q":"General channel","teaser":"Shared questions, announcements, and group bug reports.","teaserHtml":"Shared questions, announcements, and group bug reports.","a":"<p>Use <strong>General</strong> for shared questions, announcements, and bug reports the whole beta group can see.</p>","alwaysOpen":false,"tags":["Reporting","General"]},{"id":"R2","cat":"feedback","tag":"Reporting","sortKey":"2026-10-22","q":"Personal Beta Support group","teaser":"Private thread for shipment, SN, and one-to-one issues.","teaserHtml":"Private thread for shipment, <mark>SN</mark>, and one-to-one issues.","a":"<p>Your private thread for shipment details, <strong>serial number (<code>SN</code>)</strong>, and one-to-one issues.</p>","alwaysOpen":false,"tags":["Reporting","Support"]},{"id":"R3","cat":"feedback","tag":"Reporting","sortKey":"2026-10-24","q":"Which docs matter, and what should I include when reporting?","teaser":"Include SN, versions, and a screenshot; checklists live in Announcements.","teaserHtml":"Include SN, versions, and a screenshot; checklists live in Announcements.","a":"<p><strong>Announcements</strong> includes <code>Checklist.pdf</code>, <code>QuickStartGuide.pdf</code>, and <code>Checklist_revised.pdf</code> after firmware pushes.</p><p>Helpful reports include repro steps, your <strong>serial number (<code>SN</code>)</strong>, app and firmware versions, and a screenshot or short video.</p>","alwaysOpen":false,"tags":["Reporting","Docs"]}];
let tab="all", sortDir="newest";
const list=document.getElementById("list"), qEl=document.getElementById("q"), sec=document.getElementById("sec");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pills(i){const tags=(i.tags&&i.tags.length)?i.tags:[i.tag||LABELS[i.cat]||i.cat];return tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
function paint(){
  const q=(qEl.value||"").trim().toLowerCase();
  let items=DATA.slice();
  if(tab!=="all")items=items.filter(i=>i.cat===tab);
  if(q)items=items.filter(i=>(i.q+" "+i.a+" "+i.teaser+" "+i.id+" "+(i.tags||[]).join(" ")).toLowerCase().includes(q));
  items.sort((a,b)=> sortDir==="newest" ? (b.sortKey||"").localeCompare(a.sortKey||"") : (a.sortKey||"").localeCompare(b.sortKey||""));
  sec.textContent=LABELS[tab]||"Answers";
  const openIds=new Set(Array.from(list.querySelectorAll("details.item[open]")).map(el=>el.dataset.id).filter(Boolean));
  if(!items.length){list.innerHTML='<div class="empty">No matches — try another word or topic.</div>';return}
  list.innerHTML=items.map(i=>{
    const teaser=i.teaserHtml||esc(i.teaser);
    const neu=i.sortKey===PAGE_UPDATED?" is-new":"";
    const isOpen=openIds.has(i.id)?" open":"";
    return `<details class="item${neu}" data-id="${esc(i.id)}" data-cat="${esc(i.cat)}"${isOpen}><summary><div class="q">${esc(i.q)}</div><p class="teaser">${teaser}</p><div class="meta">${pills(i)}</div></summary><div class="body">${i.a}</div></details>`;
  }).join("");
}
function render(opts){if(opts&&opts.soft){list.classList.add("is-filtering");setTimeout(()=>{paint();list.classList.remove("is-filtering")},150)}else paint()}
document.querySelectorAll(".cat").forEach(btn=>btn.addEventListener("click",()=>{tab=btn.dataset.tab;document.querySelectorAll(".cat").forEach(b=>b.setAttribute("aria-selected",b===btn?"true":"false"));render({soft:true})}));
document.querySelectorAll(".sort button").forEach(btn=>btn.addEventListener("click",()=>{sortDir=btn.dataset.sort;document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"));render({soft:true})}));
qEl.addEventListener("input",()=>render());render();
const modal=document.getElementById("askModal");
function openAsk(){modal.hidden=false;requestAnimationFrame(()=>modal.classList.add("open"));document.getElementById("askQ").focus()}
function closeAsk(){modal.classList.remove("open");setTimeout(()=>{modal.hidden=true},200)}
document.getElementById("askOpen").addEventListener("click",openAsk);
document.getElementById("askCancel").addEventListener("click",closeAsk);
modal.addEventListener("click",e=>{if(e.target===modal)closeAsk()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeAsk()});
document.getElementById("askSubmit").addEventListener("click",()=>{
  const cat=document.getElementById("askCat").value.trim();
  const question=document.getElementById("askQ").value.trim();
  if(!question){document.getElementById("askQ").focus();return}
  const title=`[Beta Q&A] ${cat}: ${question.slice(0,80)}`;
  const body=`### Category\n${cat}\n\n### Question\n${question}\n\n---\nSubmitted from the public Beta Q&A Center.`;
  window.open(`https://github.com/Ves16Sirius/moonphase-flip-beta-qa/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,"_blank","noopener,noreferrer");
  closeAsk();
});
(function(){
  const bar=document.querySelector(".fresh"); if(!bar) return;
  let lastY=window.scrollY||0, away=false, locked=false; const DUR=210;
  const tick=()=>{const y=window.scrollY||0, dy=y-lastY; lastY=y; if(locked) return;
    if(!away&&dy>1.5&&y>56){away=true;locked=true;bar.classList.add("away");setTimeout(()=>locked=false,DUR)}
    else if(away&&(dy<-1.5||y<18)){away=false;locked=true;bar.classList.remove("away");setTimeout(()=>locked=false,DUR)}};
  let raf=false; window.addEventListener("scroll",()=>{if(!raf){raf=true;requestAnimationFrame(()=>{tick();raf=false})}},{passive:true});
})();
</script>
