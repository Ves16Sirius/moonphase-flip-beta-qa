<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<!-- theme-color = soft page wash (matches --bg). No purple/black slab. -->
<meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)" id="themeColorMetaLight" />
<meta name="theme-color" content="#0E0F14" media="(prefers-color-scheme: dark)" id="themeColorMetaDark" />
<meta name="theme-color" content="#F7F5F1" id="themeColorMeta" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Moonphase Flip — Beta Q&amp;A Center</title>
<script>
/* Theme bootstrap v6 — CSS @media (prefers-color-scheme) is the DEFAULT.
   data-theme ONLY after explicit toggle (manual-v5). Wipe ALL prior keys
   including manual-v5 so a stuck override cannot block OS follow on phones. */
(function(){
  var MANUAL='flip-beta-qa-theme-manual-v6';
  var STALE=[
    'flip-beta-qa-theme','flip-beta-qa-theme-v1','flip-beta-qa-theme-v2',
    'flip-beta-qa-theme-manual','flip-beta-qa-theme-v3','flip-beta-qa-theme-manual-v4',
    'flip-beta-qa-theme-manual-v5'
  ];
  try{
    for(var i=0;i<STALE.length;i++){
      try{localStorage.removeItem(STALE[i])}catch(e){}
    }
    var saved=null;
    try{
      var s=localStorage.getItem(MANUAL);
      if(s==='light'||s==='dark') saved=s;
    }catch(e){}
    if(saved){
      document.documentElement.setAttribute('data-theme', saved);
      document.documentElement.style.colorScheme=saved;
    }else{
      document.documentElement.removeAttribute('data-theme');
      document.documentElement.style.colorScheme='light dark';
      document.documentElement.style.backgroundColor='';
    }
  }catch(e){
    try{document.documentElement.removeAttribute('data-theme')}catch(_){}
  }
})();
</script>
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/index.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" />
<style>
/* Overhaul 2026-10-25 — type tokens · soft top aurora (8a41356 lineage) · system dark v6 */
:root{
  /* Surfaces */
  --bg:#F7F5F1;
  --bg-deep:#EFEBE4;
  --surface:#FFFFFF;
  /* Ink hierarchy */
  --ink:#1A1917;
  --ink-soft:#2A2825;
  --title:#141210;
  --muted:#7C766E;
  --faint:#A8A29A;
  /* Lines & accents */
  --line:rgba(12,10,8,.065);
  --line2:rgba(12,10,8,.11);
  --accent:#635BFF;
  --accent-deep:#4F46E5;
  --accent-soft:rgba(99,91,255,.11);
  --cta:rgba(99,91,255,.08);
  --cta-ink:#4338CA;
  --cta-border:rgba(99,91,255,.20);
  --cta-hover:rgba(99,91,255,.14);
  --ok:#2F9E6B;
  --ok-soft:rgba(47,158,107,.14);
  /* Elevation */
  --shadow-sm:0 1px 2px rgba(24,18,12,.03), 0 2px 8px rgba(24,18,12,.035);
  --shadow-md:
    0 1px 2px rgba(24,18,12,.028),
    0 6px 18px rgba(24,18,12,.045),
    0 18px 40px rgba(90,70,180,.04);
  --shadow-lg:
    0 2px 4px rgba(24,18,12,.03),
    0 14px 36px rgba(24,18,12,.06),
    0 32px 64px rgba(90,70,180,.055);
  --control-bg:rgba(255,255,255,.78);
  --ease:cubic-bezier(.22,1,.36,1);
  --dur:180ms;
  --r:20px;
  /* Families */
  --font:"Geist Sans",Geist,Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --display:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* Type scale */
  --fs-hero:clamp(2.5rem,5.4vw,3.5rem);
  --fs-title:15.5px;
  --fs-body:14.5px;
  --fs-ui:13.5px;
  --fs-meta:12.5px;
  --fs-tag:11.5px;
  --fs-mono:11px;
  --fw-regular:400;
  --fw-medium:500;
  --fw-semibold:600;
  --lh-tight:1.2;
  --lh-title:1.32;
  --lh-body:1.62;
  --lh-ui:1.45;
  /* Controls / cards */
  --control-h:34px;
  --space:8px;
  --card-pad-x:24px;
  --card-pad-y:22px;
  color-scheme:light dark;
}
*,*::before,*::after{box-sizing:border-box}
html{
  scroll-behavior:smooth;overflow-x:hidden;width:100%;max-width:100%;
  color-scheme:light dark;
  background-color:var(--bg);
  background:var(--bg);
}
body{
  margin:0;min-height:100vh;min-height:100dvh;color:var(--ink-soft);
  background-color:var(--bg);
  background:var(--bg);
  font-family:var(--font);font-size:15px;line-height:1.55;font-weight:var(--fw-regular);
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  width:100%;max-width:100%;
  position:relative;
}
/* Restrained TOP aurora only (Linear/Vercel). Extends UP behind status bar.
   Soft radial wash — NEVER an opaque purple/black crown slab. */
.aurora{
  position:fixed;
  top:calc(-1 * env(safe-area-inset-top, 0px));
  left:0;right:0;
  width:100%;
  height:calc(env(safe-area-inset-top, 0px) + min(280px, 38dvh));
  margin:0;padding:0;
  pointer-events:none;
  z-index:0;
  overflow:visible;
  background:
    radial-gradient(ellipse 100% 80% at 50% -20%, rgba(168,145,255,.38), transparent 70%),
    radial-gradient(ellipse 75% 65% at 10% -15%, rgba(255,160,195,.26), transparent 68%),
    radial-gradient(ellipse 70% 60% at 90% -12%, rgba(255,200,160,.22), transparent 66%),
    radial-gradient(ellipse 55% 50% at 70% -5%, rgba(255,230,190,.14), transparent 62%),
    radial-gradient(ellipse 50% 45% at 30% -8%, rgba(170,205,255,.16), transparent 66%);
  filter:blur(52px) saturate(110%);
  opacity:.88;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 50%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 50%,transparent 100%);
}
/* Keep crown node inert — no solid bar paint */
.aurora-crown{display:none!important}
.aurora-blobs{display:none!important}
.fresh,.shell,.modal-backdrop{position:relative;z-index:1}
.modal-backdrop{z-index:100}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent-deep);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
::selection{background:var(--accent-soft);color:var(--ink)}

/* —— Updated chip —— */
.fresh{
  display:flex;justify-content:center;align-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 0;
  background:transparent;border:0;box-shadow:none;
}
.fresh span{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px;border-radius:999px;
  background:var(--control-bg);
  border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--shadow-sm);
  font-family:var(--mono);font-size:var(--fs-mono);font-weight:var(--fw-medium);
  letter-spacing:.02em;color:var(--muted);
}
.fresh i{
  width:6px;height:6px;border-radius:50%;background:var(--ok);
  display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 3px var(--ok-soft); /* soft ring only — no scatter glow */
  animation:none;
}
@media (prefers-reduced-motion:reduce){
  .fresh i{animation:none!important}
}

/* —— Shell: comfortable max-width, balanced inset —— */
.shell{
  width:min(1120px,100%);margin:0 auto;
  padding:0 32px max(88px, env(safe-area-inset-bottom, 0px));
  padding-left:max(32px, env(safe-area-inset-left, 0px));
  padding-right:max(32px, env(safe-area-inset-right, 0px));
  position:relative;
}
.shell::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  opacity:.03;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.04 0 0 0 0 0.03 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 65%);
  mask-image:linear-gradient(180deg,#000 0%,#000 30%,transparent 65%);
}
.shell > *{position:relative;z-index:1}

/* —— Brand row —— */
.brand{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  margin:24px 0 32px;position:relative;min-height:32px;
}
.brand-slot{
  flex:1 1 0;display:flex;align-items:flex-start;min-width:0;min-height:32px;
}
.brand-slot-start{justify-content:flex-start}
.brand-slot-end{justify-content:flex-end}
.brand-mark{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:center;
}
.brand .wm{height:32px;width:auto;display:block}
.theme-toggle{
  position:static;transform:none;
  align-self:flex-start;
  margin-top:6px; /* optical: SVG top pad → glyph tops */
  height:32px;min-height:32px;width:32px;min-width:32px;padding:0;border-radius:999px;gap:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  color:var(--muted);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.theme-toggle:hover{
  color:var(--ink);border-color:var(--line2);background:#fff;
  box-shadow:var(--shadow-md);
}
.theme-toggle:active{transform:none}
.theme-toggle svg{width:14px;height:14px;display:block;flex:0 0 auto}
.theme-toggle .tlabel{display:none;line-height:1}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
.theme-toggle .tlabel-light{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:block}
  :root:not([data-theme="light"]) .theme-toggle .icon-moon{display:none}
  :root:not([data-theme="light"]) .theme-toggle .tlabel-dark{display:none}
  :root:not([data-theme="light"]) .theme-toggle .tlabel-light{display:inline}
}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}
[data-theme="dark"] .theme-toggle .tlabel-dark{display:none}
[data-theme="dark"] .theme-toggle .tlabel-light{display:inline}

/* —— Hero: editorial air (8px rhythm) —— */
.hero{
  margin:0 auto 40px;max-width:640px;
  text-align:center;display:flex;flex-direction:column;align-items:center;
}
.hero h1{
  margin:0 0 12px;
  font-family:var(--display);
  font-size:var(--fs-hero);
  font-weight:var(--fw-regular);font-style:normal;
  letter-spacing:-.02em;line-height:1.06;
  color:var(--title);
  text-wrap:balance;
}
.hero .sub{
  margin:0 0 28px;font-size:16px;font-weight:var(--fw-regular);letter-spacing:-.012em;
  line-height:1.5;color:var(--muted);max-width:400px;
}
.ask-cta{
  display:inline-flex;align-items:center;justify-content:center;
  height:var(--control-h);padding:0 18px;
  border-radius:999px;
  background:var(--cta);color:var(--cta-ink);
  font-size:var(--fs-ui);font-weight:var(--fw-medium);letter-spacing:-.014em;
  border:1px solid var(--cta-border);
  box-shadow:0 1px 2px rgba(24,18,12,.03);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.ask-cta:hover{
  background:var(--cta-hover);transform:translateY(-1px);
  border-color:rgba(99,91,255,.34);
  box-shadow:0 2px 8px rgba(99,91,255,.12);
}
.ask-cta:active{transform:none}

.layout{display:block}
.rail{display:none!important}

/* —— Control band: one clear block —— */
.controls{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin:0 auto 32px;max-width:720px;
}
.chips{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:0;padding:0;max-width:680px;
}
.chip{
  flex:0 0 auto;height:var(--control-h);padding:0 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:var(--fs-ui);font-weight:var(--fw-medium);letter-spacing:-.011em;color:var(--ink-soft);
  white-space:nowrap;box-shadow:var(--shadow-sm);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.chip:hover{border-color:var(--line2);background:#fff;transform:translateY(-.5px)}
.chip[aria-selected="true"]{
  background:color-mix(in srgb, var(--accent) 12%, #fff);
  border-color:color-mix(in srgb, var(--accent) 28%, transparent);
  color:var(--accent-deep);
  box-shadow:0 1px 2px rgba(99,91,255,.06), 0 4px 12px rgba(99,91,255,.08);
}

.toolbar{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:0;
}
.search{
  position:relative;display:flex;align-items:center;
  width:280px;height:var(--control-h);padding:0 14px 0 36px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.search:focus-within{
  border-color:color-mix(in srgb, var(--accent) 36%, var(--line));
  box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-sm);
}
.search svg{
  position:absolute;left:13px;width:14px;height:14px;color:var(--faint);pointer-events:none;
}
.search input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  font-size:13.5px;letter-spacing:-.01em;color:var(--ink);
}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.sort{
  display:inline-flex;align-items:center;height:var(--control-h);padding:3px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--control-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-sm);
}
.sort button{
  height:calc(var(--control-h) - 6px);padding:0 14px;border-radius:999px;
  font-size:13px;font-weight:500;letter-spacing:-.01em;color:var(--muted);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.sort button[aria-pressed="true"]{
  background:color-mix(in srgb, var(--accent) 12%, #fff);
  color:var(--accent-deep);
  box-shadow:0 1px 3px rgba(99,91,255,.08);
}

.sec{
  font-size:12.5px;font-weight:500;letter-spacing:-.008em;
  color:var(--faint);margin:0 0 16px;text-align:center;
  text-transform:none;font-family:var(--font);
}

/* —— Cards —— */
#list{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
#list.is-filtering{opacity:.4;transition:opacity var(--dur) var(--ease)}
.item{
  flex:1 1 100%;
  border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
  animation:cardIn 200ms var(--ease) both;
}
@media (min-width:720px){.item{flex:1 1 calc(50% - 8px);max-width:calc(50% - 8px)}}
.item:hover{
  border-color:var(--line2);
  box-shadow:var(--shadow-lg);
  transform:translateY(-1.5px);
}
.item.is-new{
  box-shadow:var(--shadow-md), 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.item:nth-child(1){animation-delay:0ms}
.item:nth-child(2){animation-delay:24ms}
.item:nth-child(3){animation-delay:48ms}
.item:nth-child(4){animation-delay:72ms}
.item:nth-child(5){animation-delay:96ms}
.item:nth-child(6){animation-delay:120ms}
.item:nth-child(n+7){animation-delay:144ms}

.item summary{
  list-style:none;cursor:pointer;position:relative;
  padding:var(--card-pad-y) 44px var(--card-pad-y) var(--card-pad-x);
}
.item summary::-webkit-details-marker{display:none}
.item summary::after{
  content:"";position:absolute;right:18px;top:26px;
  width:8px;height:8px;
  border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), top var(--dur) var(--ease);
}
.item[open] summary::after{
  transform:rotate(225deg);
  border-color:var(--muted);
  top:30px;
}
.item:hover summary::after{border-color:var(--muted)}
.item .q{
  font-size:var(--fs-title);font-weight:var(--fw-semibold);letter-spacing:-.024em;line-height:var(--lh-title);
  color:var(--ink);margin:0 0 10px;
}
.item .teaser{
  margin:0 0 14px;font-size:var(--fs-ui);font-weight:var(--fw-regular);letter-spacing:-.01em;
  line-height:var(--lh-ui);color:var(--muted);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  overflow:hidden;
}
.item[open] .teaser{display:none}
.item .teaser mark{
  background:transparent;color:var(--ink-soft);font-weight:var(--fw-medium);
}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

/* Primer soft tags — solid green dot, ZERO outward glow */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  height:22px;padding:0 9px 0 8px;
  border-radius:999px;
  border:0;
  background:#dafbe1;
  box-shadow:none!important;
  filter:none!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  font-family:var(--font);font-size:var(--fs-tag);font-weight:var(--fw-medium);
  letter-spacing:-.01em;text-transform:none;
  color:#116329;
  line-height:1;
  text-shadow:none;
  transition:background 150ms var(--ease), color 150ms var(--ease);
}
.pill::before{
  content:"";
  width:5px;height:5px;border-radius:50%;
  background:#2EA043;
  display:inline-block;flex:0 0 auto;
  box-shadow:none!important;
  filter:none!important;
}
.pill:hover{background:#c8efd4;color:#0a5328}

.item .body{
  padding:4px var(--card-pad-x) var(--card-pad-y);border-top:1px solid var(--line);
  animation:bodyIn 180ms var(--ease) both;
}
@keyframes bodyIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.item .body p{margin:14px 0 0;font-size:var(--fs-body);letter-spacing:-.01em;line-height:var(--lh-body);color:var(--ink-soft)}
.item .body p:first-child{margin-top:14px}
.item .body code{
  font-family:var(--mono);font-size:var(--fs-meta);padding:1px 5px;border-radius:5px;
  background:rgba(99,91,255,.07);border:1px solid rgba(99,91,255,.11);color:var(--accent-deep);
}
.item .body strong{font-weight:var(--fw-semibold);color:var(--ink)}

.empty{
  flex:1 1 100%;text-align:center;padding:56px 16px;
  color:var(--muted);font-size:14px;letter-spacing:-.01em;
  background:rgba(255,255,255,.45);border:1px dashed var(--line);border-radius:var(--r);
}

footer{
  display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;
  margin:48px 0 0;padding:24px 0 0;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);
}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(16,14,12,.36);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;transition:opacity 200ms var(--ease);
}
.modal-backdrop[hidden]{display:none}
.modal-backdrop.open{opacity:1}
.modal{
  width:min(420px,100%);padding:26px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  transform:translateY(5px);transition:transform 200ms var(--ease);
}
.modal-backdrop.open .modal{transform:none}
.modal h2{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.modal .hint{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.45}
.modal label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.modal select,.modal textarea{
  width:100%;margin:0 0 14px;padding:10px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);outline:0;
  font-size:13.5px;letter-spacing:-.01em;color:var(--ink-soft);
  transition:border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.modal select:focus,.modal textarea:focus{
  border-color:color-mix(in srgb, var(--accent) 40%, var(--line));
  box-shadow:0 0 0 3px var(--accent-soft);
}
.modal textarea{min-height:100px;resize:vertical}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn{
  height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:500;color:var(--ink-soft);background:transparent;
  transition:background 150ms var(--ease), opacity 150ms var(--ease);
}
.btn:hover{background:rgba(10,10,10,.04)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta-border);box-shadow:0 1px 2px rgba(24,18,12,.03)}
.btn.primary:hover{opacity:.92}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .item:hover{transform:none}
}

<script>


const PAGE_UPDATED="2026-10-24";
const LABELS={"all":"All answers","getting-started":"Getting started","device":"Device","app-firmware":"App & firmware","recording-ai":"Recording & AI","privacy":"Privacy","feedback":"Reporting"};
const DATA=[{"id":"FB-004","cat":"getting-started","tag":"Getting started","sortKey":"2026-10-22","q":"How do I track shipping, and where do I report bugs?","teaser":"UPS delivery; tracking arrives by email. Report bugs in General or Beta Support.","teaserHtml":"<mark>UPS</mark> delivery; tracking arrives by email. Report bugs in <mark>General</mark> or <mark>Beta Support</mark>.","a":"<p>Devices ship with <code>UPS</code>. You’ll get an email from the team; tracking can take a little while to appear.</p><p>For bugs, post in <strong>General</strong> or your personal <strong>Beta Support</strong> group.</p>","alwaysOpen":false,"tags":["Getting started","Shipping"]},{"id":"FB-035","cat":"getting-started","tag":"Getting started","sortKey":"2026-10-24","q":"My device just arrived — what should I do first?","teaser":"Follow Checklist_revised.pdf steps 1–7 (share SN), wait for us to remind you, then continue from step 8.","teaserHtml":"Follow <mark>Checklist_revised.pdf</mark> steps 1–7 (share SN), wait for us to remind you, then continue from step 8.","a":"<p>In the WhatsApp beta community, open <strong>Announcements</strong> and use <code>Checklist_revised.pdf</code> and <code>QuickStartGuide.pdf</code> as your guides.</p><p>Follow <code>Checklist_revised.pdf</code> step by step through <strong>steps 1–7</strong> (including sharing your <strong>serial number (<code>SN</code>)</strong>). Then <strong>stop</strong> and wait for us to remind you.</p><p>After our reminder, continue from <strong>step 8</strong> and set up the device.</p>","alwaysOpen":false,"tags":["Getting started","Setup"]},{"id":"FB-014","cat":"device","tag":"Device","sortKey":"2026-10-24","q":"Recording shows activity, but nothing returns — or I’m stuck on firmware 1.0.68?","teaser":"Share your SN, wait for our firmware-push notice, then follow Checklist_revised.pdf.","teaserHtml":"Share your <mark>SN</mark>, wait for our firmware-push notice, then follow <mark>Checklist_revised.pdf</mark>.","a":"<p>Devices often ship on older firmware (including <code>1.0.68</code>). Send your <strong>serial number (<code>SN</code>)</strong> in <strong>General</strong> or your private <strong>Beta Support</strong> group.</p><p><strong>Wait</strong> for our notice that new firmware was pushed to your device. The app’s Firmware Update screen may not show it right away.</p><p>After that notice, open <strong>Announcements</strong> and follow <code>Checklist_revised.pdf</code> (use the <code>TestFlight</code> build the checklist names). Then keep app and firmware current, and <strong>unbind and re-pair</strong> if data still needs to sync to the Flip screen.</p>","alwaysOpen":false,"tags":["Device","Firmware"]},{"id":"FB-034","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Which iOS app build should I install?","teaser":"Use the listed TestFlight build for iOS beta.","teaserHtml":"Use the listed <mark>TestFlight</mark> build for iOS beta.","a":"<p>Install via <code>TestFlight</code>.</p><p>Current build: <strong>1.0.1 (1217)</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","iOS"]},{"id":"FB-009","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Calendar shows in the app but not on the device — or Bluetooth is connected with no voice actions?","teaser":"Usually an app + firmware mismatch — share SN if asked, then wait for our push.","teaserHtml":"Usually an <mark>app + firmware</mark> mismatch — share SN if asked, then wait for our push.","a":"<p>This is usually an <strong>app and firmware version</strong> mismatch.</p><p>Send your <strong>serial number (<code>SN</code>)</strong> if asked, then <strong>wait for our notification</strong> that a firmware update has been pushed. After the push, calendars listed in the app should be able to sync to the device.</p><p>Android / Fold calendar feedback is noted; <strong>no commitment yet</strong>.</p>","alwaysOpen":false,"tags":["App & firmware","Sync"]},{"id":"FB-028","cat":"app-firmware","tag":"App & firmware","sortKey":"2026-10-24","q":"Why do I see characters in other languages in the UI or AI output?","teaser":"AI language/prompt issue under fix — send a screenshot if it returns.","teaserHtml":"AI language/prompt issue under fix — send a screenshot if it returns.","a":"<p>Characters in other languages in the UI or AI output are treated as an <strong>AI language / prompt</strong> issue. The team is refining prompts.</p><p>If it continues, send a screenshot in <strong>General</strong> or your personal <strong>Beta Support</strong> group.</p>","alwaysOpen":false,"tags":["App & firmware","AI"]},{"id":"FB-015","cat":"recording-ai","tag":"Recording & AI","sortKey":"2026-10-23","q":"Can I leave recording on all day?","teaser":"Yes — leave it on all day. It only saves when someone speaks; auto-clears after phone sync.","teaserHtml":"Yes — leave it on all day. It only saves when someone speaks; auto-clears after phone sync.","a":"<p>Yes — you can leave recording on all day.</p><p>It <strong>only saves when someone is speaking</strong>. After sync to the phone, the device <strong>auto-clears</strong> (no manual purge).</p>","alwaysOpen":false,"tags":["Recording & AI","Battery"]},{"id":"FB-024","cat":"privacy","tag":"Privacy","sortKey":"2026-10-24","q":"Can I use Flip with other AIs via MCP under the NDA?","teaser":"Yes — MCP with other AIs is allowed in this beta.","teaserHtml":"Yes — <mark>MCP</mark> with other AIs is allowed in this beta.","a":"<p><code>MCP</code> is part of the beta. You’re free to try it with other AIs.</p>","alwaysOpen":false,"tags":["Privacy","MCP"]},{"id":"R1","cat":"feedback","tag":"Reporting","sortKey":"2026-10-22","q":"General channel","teaser":"Shared questions, announcements, and group bug reports.","teaserHtml":"Shared questions, announcements, and group bug reports.","a":"<p>Use <strong>General</strong> for shared questions, announcements, and bug reports the whole beta group can see.</p>","alwaysOpen":false,"tags":["Reporting","General"]},{"id":"R2","cat":"feedback","tag":"Reporting","sortKey":"2026-10-22","q":"Personal Beta Support group","teaser":"Private thread for shipment, SN, and one-to-one issues.","teaserHtml":"Private thread for shipment, <mark>SN</mark>, and one-to-one issues.","a":"<p>Your private thread for shipment details, <strong>serial number (<code>SN</code>)</strong>, and one-to-one issues.</p>","alwaysOpen":false,"tags":["Reporting","Support"]},{"id":"R3","cat":"feedback","tag":"Reporting","sortKey":"2026-10-24","q":"Which docs matter, and what should I include when reporting?","teaser":"Include SN, versions, and a screenshot; QuickStartGuide.pdf and Checklist_revised.pdf live in Announcements.","teaserHtml":"Include SN, versions, and a screenshot; <mark>QuickStartGuide.pdf</mark> and <mark>Checklist_revised.pdf</mark> live in Announcements.","a":"<p><strong>Announcements</strong> includes <code>QuickStartGuide.pdf</code> and <code>Checklist_revised.pdf</code>.</p><p>Helpful reports include repro steps, your <strong>serial number (<code>SN</code>)</strong>, app and firmware versions, and a screenshot or short video.</p>","alwaysOpen":false,"tags":["Reporting","Docs"]}];
let tab="all", sortDir="newest";
const list=document.getElementById("list"), qEl=document.getElementById("q"), sec=document.getElementById("sec");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function pills(i){const tags=(i.tags&&i.tags.length)?i.tags:[i.tag||LABELS[i.cat]||i.cat];return tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}
function paint(){
  const q=(qEl.value||"").trim().toLowerCase();
  let items=DATA.slice();
  if(tab!=="all")items=items.filter(i=>i.cat===tab);
  if(q)items=items.filter(i=>(i.q+" "+i.a+" "+i.teaser+" "+i.id+" "+(i.tags||[]).join(" ")).toLowerCase().includes(q));
  items.sort((a,b)=> sortDir==="newest" ? (b.sortKey||"").localeCompare(a.sortKey||"") : (a.sortKey||"").localeCompare(b.sortKey||""));
  sec.textContent=(tab==="all"?`${items.length} answers`:`${items.length} in ${LABELS[tab]||"topic"}`);
  const openIds=new Set(Array.from(list.querySelectorAll("details.item[open]")).map(el=>el.dataset.id).filter(Boolean));
  if(!items.length){list.innerHTML='<div class="empty">No matches — try another word or topic.</div>';return}
  list.innerHTML=items.map(i=>{
    const teaser=i.teaserHtml||esc(i.teaser);
    const neu=i.sortKey===PAGE_UPDATED?" is-new":"";
    const isOpen=openIds.has(i.id)?" open":"";
    return `<details class="item${neu}" data-id="${esc(i.id)}" data-cat="${esc(i.cat)}"${isOpen}><summary><div class="q">${esc(i.q)}</div><p class="teaser">${teaser}</p><div class="meta">${pills(i)}</div></summary><div class="body">${i.a}</div></details>`;
  }).join("");
}
function render(opts){if(opts&&opts.soft){list.classList.add("is-filtering");setTimeout(()=>{paint();list.classList.remove("is-filtering")},150)}else paint()}
document.querySelectorAll(".sort button").forEach(btn=>btn.addEventListener("click",()=>{sortDir=btn.dataset.sort;document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b===btn?"true":"false"));render({soft:true})}));
qEl.addEventListener("input",()=>render());render();
const modal=document.getElementById("askModal");
function openAsk(){modal.hidden=false;requestAnimationFrame(()=>modal.classList.add("open"));document.getElementById("askQ").focus()}
function closeAsk(){modal.classList.remove("open");setTimeout(()=>{modal.hidden=true},200)}
document.getElementById("askOpen").addEventListener("click",openAsk);
document.getElementById("askCancel").addEventListener("click",closeAsk);
modal.addEventListener("click",e=>{if(e.target===modal)closeAsk()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeAsk()});
document.getElementById("askSubmit").addEventListener("click",()=>{
  const cat=document.getElementById("askCat").value.trim();
  const question=document.getElementById("askQ").value.trim();
  if(!question){document.getElementById("askQ").focus();return}
  const title=`[Beta Q&A] ${cat}: ${question.slice(0,80)}`;
  const body=`### Category\n${cat}\n\n### Question\n${question}\n\n---\nSubmitted from the public Beta Q&A Center.`;
  window.open(`https://github.com/Ves16Sirius/moonphase-flip-beta-qa/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,"_blank","noopener,noreferrer");
  closeAsk();
});

/* Theme toggle v6 — CSS @media is the default (no data-theme).
   data-theme + manual-v6 ONLY after an explicit click. All stale keys wiped (incl v5). */
(function(){
  const MANUAL='flip-beta-qa-theme-manual-v6';
  const STALE=['flip-beta-qa-theme','flip-beta-qa-theme-v1','flip-beta-qa-theme-v2','flip-beta-qa-theme-manual','flip-beta-qa-theme-v3','flip-beta-qa-theme-manual-v4','flip-beta-qa-theme-manual-v5'];
  const root=document.documentElement;
  const btn=document.getElementById('themeToggle');
  const meta=document.getElementById('themeColorMeta');
  const metaL=document.getElementById('themeColorMetaLight');
  const metaD=document.getElementById('themeColorMetaDark');
  const LIGHT_TC='#F7F5F1'; /* soft page wash — matches --bg */
  const DARK_TC='#0E0F14';
  for(const k of STALE){try{localStorage.removeItem(k)}catch(e){}}
  function systemTheme(){
    try{return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
    catch(e){return 'light'}
  }
  function manualPref(){
    try{
      const s=localStorage.getItem(MANUAL);
      return (s==='light'||s==='dark')?s:null;
    }catch(e){return null}
  }
  function current(){
    const a=root.getAttribute('data-theme');
    if(a==='dark'||a==='light') return a;
    return systemTheme();
  }
  function setThemeColor(theme, manual){
    const tc=theme==='dark'?DARK_TC:LIGHT_TC;
    if(meta) meta.setAttribute('content', tc);
    if(manual){
      if(metaL) metaL.setAttribute('content', tc);
      if(metaD) metaD.setAttribute('content', tc);
      try{
        root.style.backgroundColor=tc;
        if(document.body) document.body.style.backgroundColor=tc;
      }catch(e){}
    }else{
      if(metaL) metaL.setAttribute('content', LIGHT_TC);
      if(metaD) metaD.setAttribute('content', DARK_TC);
      /* Clear inline bg so CSS @media + var(--bg) drive the page */
      try{
        root.style.backgroundColor='';
        if(document.body) document.body.style.backgroundColor='';
      }catch(e){}
    }
    if(btn){
      btn.setAttribute('aria-label', theme==='dark'?'Switch to light theme':'Switch to dark theme');
      btn.title=theme==='dark'?'Light':'Dark';
    }
  }
  function followSystem(){
    root.removeAttribute('data-theme');
    root.style.colorScheme='light dark';
    setThemeColor(systemTheme(), false);
  }
  function applyManual(theme){
    root.setAttribute('data-theme', theme);
    root.style.colorScheme=theme;
    try{localStorage.setItem(MANUAL, theme)}catch(e){}
    setThemeColor(theme, true);
  }
  const saved=manualPref();
  if(saved) applyManual(saved);
  else followSystem();
  if(btn) btn.addEventListener('click',()=>{
    applyManual(current()==='dark'?'light':'dark');
  });
  try{
    const mq=window.matchMedia('(prefers-color-scheme: dark)');
    const onChange=()=>{ if(!manualPref()) followSystem(); };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }catch(e){}
})();
